name: Deploy (Push to main)

# Runs on every merge to main. Three sequential jobs:
#   1. terraform-apply        — provision/update Azure infra (AKS, ACR, etc.)
#   2. build-and-push-image   — build the openclaw image, push :latest+:sha to ACR
#   3. deploy-to-aks          — kubectl apply -f k8s/, then rollout restart
#
# Each job depends on the previous one succeeding (`needs:`), so a broken
# step short-circuits the rest before it can do damage.

on:
  push:
    branches:
      - main
    paths:
      - 'builder/**'
      - 'k8s/**'
      - 'VERSIONS'
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: clwcodecodevdev1.azurecr.io
  IMAGE_NAME: openclaw/claw-code

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read TERRAFORM_VERSION from /VERSIONS
        id: tfver
        run: |
          echo "version=$(grep '^TERRAFORM_VERSION=' VERSIONS | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: true

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials for kubernetes/helm providers
        run: |
          az aks get-credentials \
            --resource-group claw-code \
            --name claw-code-aks \
            --file /tmp/kubeconfig_clawcode \
            --admin

      - name: Set Terraform environment variables
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_USE_AZUREAD_AUTH=true" >> $GITHUB_ENV
          echo "TF_VAR_env=dev" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=terraform" \
            -backend-config="storage_account_name=mytofustates" \
            -backend-config="container_name=claw-code" \
            -backend-config="key=dev.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Upload Terraform Output
        run: terraform output -json > terraform_output.json

      - name: Upload Terraform Output artifact
        uses: actions/upload-artifact@v6
        with:
          name: terraform-output
          path: terraform_output.json
          retention-days: 30

      - name: Azure logout
        if: always()
        run: |
          az logout
          rm -rf ~/.azure 2>/dev/null || true

  build-and-push-image:
    name: Build and Push Docker image to ACR
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name clwcodecodevdev1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure openclaw-base is mirrored from GHCR into ACR
        run: |
          set -euo pipefail
          OPENCLAW_UPSTREAM=$(grep '^OPENCLAW_UPSTREAM=' VERSIONS | cut -d= -f2)
          SRC_TAG="${OPENCLAW_UPSTREAM#v}"
          if az acr repository show \
               --name clwcodecodevdev1 \
               --image "openclaw/openclaw-base:${OPENCLAW_UPSTREAM}" >/dev/null 2>&1; then
            echo "openclaw/openclaw-base:${OPENCLAW_UPSTREAM} already present in ACR — skipping import"
          else
            az acr import \
              --name clwcodecodevdev1 \
              --source "ghcr.io/openclaw/openclaw:${SRC_TAG}" \
              --image "openclaw/openclaw-base:${OPENCLAW_UPSTREAM}"
          fi

      - name: Read version pins from /VERSIONS
        id: version
        run: |
          set -euo pipefail
          SHORT_SHA="${{ github.sha }}"
          echo "short_sha=${SHORT_SHA:0:8}" >> $GITHUB_OUTPUT
          for key in OPENCLAW_UPSTREAM GH_CLI_VERSION GITHUB_MCP_SERVER_VERSION \
                     TERRAFORM_VERSION TERRAFORM_MCP_VERSION CODE_SERVER_VERSION \
                     AWS_CLI_VERSION GCLOUD_VERSION ALIYUN_CLI_VERSION; do
            echo "${key}=$(grep "^${key}=" VERSIONS | cut -d= -f2)" >> $GITHUB_OUTPUT
          done

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./builder
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.short_sha }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/openclaw/openclaw-base:${{ steps.version.outputs.OPENCLAW_UPSTREAM }}
            GH_CLI_VERSION=${{ steps.version.outputs.GH_CLI_VERSION }}
            GITHUB_MCP_SERVER_VERSION=${{ steps.version.outputs.GITHUB_MCP_SERVER_VERSION }}
            TERRAFORM_VERSION=${{ steps.version.outputs.TERRAFORM_VERSION }}
            TERRAFORM_MCP_VERSION=${{ steps.version.outputs.TERRAFORM_MCP_VERSION }}
            CODE_SERVER_VERSION=${{ steps.version.outputs.CODE_SERVER_VERSION }}
            AWS_CLI_VERSION=${{ steps.version.outputs.AWS_CLI_VERSION }}
            GCLOUD_VERSION=${{ steps.version.outputs.GCLOUD_VERSION }}
            ALIYUN_CLI_VERSION=${{ steps.version.outputs.ALIYUN_CLI_VERSION }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure logout
        if: always()
        run: |
          az logout
          rm -rf ~/.azure 2>/dev/null || true

  deploy-to-aks:
    name: Deploy to AKS (apply manifests + rollout)
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment: dev
    env:
      KUBECONFIG: /tmp/kubeconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group claw-code \
            --name claw-code-aks \
            --file /tmp/kubeconfig \
            --admin

      - name: Install kubectl
        run: |
          ARCH=$(dpkg --print-architecture)
          mkdir -p "$HOME/.local/bin"
          KUBECTL_VERSION="$(curl -sL https://dl.k8s.io/release/stable.txt)"
          curl -sLo "$HOME/.local/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply k8s/ manifests
        run: kubectl apply -f k8s/

      - name: Roll out openclaw deployment to pick up new :latest image
        run: |
          kubectl rollout restart deployment/openclaw -n openclaw
          kubectl rollout status   deployment/openclaw -n openclaw --timeout=15m

      - name: Azure logout
        if: always()
        run: |
          az logout
          rm -rf ~/.azure 2>/dev/null || true
