name: Deploy (Push to main)

# Runs on every merge to main. Sequential jobs, each needing the last:
#   0. wait-for-verify        — WAIT for Verify to pass on this commit
#   1. check-llm-secrets      — fail-fast if neither LLM API key is set
#   2. tofu-apply        — provision/update Azure infra (AKS, ACR, etc.)
#   3. build-and-push-image   — build the openclaw image, push :latest+:sha to ACR
#   4. deploy-to-aks          — ship ConfigMaps, kubectl apply -f k8s/, await rollout
#
# Each job depends on the previous one succeeding (`needs:`), so a broken
# step short-circuits the rest before it can do damage.

on:
  push:
    branches:
      - main
    paths:
      - 'builder/**'
      - 'k8s/**'
      - 'VERSIONS'
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/deploy.yml'
      # Verify gates this workflow now, so a change to what Verify DOES is a
      # change to what may deploy. Without this, edits to the gate itself
      # triggered nothing and the deploy sat on an older commit — which is
      # exactly what happened while wiring the gate up.
      - '.github/workflows/validate.yml'

env:
  REGISTRY: clwcodecodevdev2.azurecr.io
  IMAGE_NAME: openclaw/claw-code

permissions:
  id-token: write
  contents: read

# One run per branch. Pushing again while a run is in flight used to leave the
# older one CANCELLED — and a cancelled Verify is not a passing Verify, so the
# deploy gate correctly refused it and reported a failure for a commit nobody
# was waiting on any more. Superseding the run explicitly says that is what
# happened, instead of leaving a red mark on a commit that has been overtaken.
concurrency:
  group: deploy-${{ github.ref }}
  # QUEUE, do not cancel. Verify can be killed mid-run harmlessly; an apply
  # cannot. Cancelling one mid-`tofu apply` leaves the state blob LOCKED, and
  # the next run then fails with "state blob is already locked" until the lease
  # expires — which is exactly what happened here, twice, once the group was
  # added with cancel-in-progress.
  #
  # Queuing costs a few minutes of waiting. Cancelling costs a locked state and
  # possibly a half-applied one, which is not a trade worth making to save
  # them.
  cancel-in-progress: false

jobs:
  wait-for-verify:
    name: Wait For Verify
    runs-on: ubuntu-latest
    # WHY THE BUILD WAITS.
    #
    # Verify and Deploy both trigger on the same push, so they used to race:
    # on 2026-08-21 a commit whose unit tests failed still built and pushed an
    # image, because nothing connected the two workflows. The image was fine
    # that time — the failure was in a test's own calling convention — but the
    # pipeline had no opinion either way, which is the actual problem.
    #
    # A `workflow_run` trigger is the other way to do this. It is not used
    # because it runs in the context of the DEFAULT BRANCH and hands you the
    # triggering commit only as an input, so every checkout in this file would
    # have to thread that SHA through correctly or silently deploy the wrong
    # tree. Polling keeps `github.sha` meaning what it says.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the Verify checks on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          # Verify builds an image of its own to prove the Dockerfile still
          # builds. Waiting for it here would mean building the same image
          # twice in series before anything ships — this job builds its own
          # a few steps later regardless. The CHECKS are what must pass.
          SKIP_JOB: Docker Build (no push)
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/validate.yml/runs?head_sha=${SHA}&per_page=1" \
              --jq '.workflow_runs[0].id // empty' 2>/dev/null || echo "")"

            if [ -n "$run_id" ]; then
              # Every check except the image build, as "name<TAB>status<TAB>conclusion".
              jobs="$(gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
                --jq ".jobs[] | select(.name != \"${SKIP_JOB}\") | [.name, .status, .conclusion] | @tsv" \
                2>/dev/null || echo "")"

              if [ -n "$jobs" ]; then
                # Fail as soon as one does, rather than after the slowest.
                bad="$(printf '%s\n' "$jobs" | awk -F'\t' '$2=="completed" && $3!="success" && $3!="skipped" {print $1" ("$3")"}')"
                if [ -n "$bad" ]; then
                  echo "::error::Verify checks failed on ${SHA}: ${bad}"
                  exit 1
                fi
                pending="$(printf '%s\n' "$jobs" | awk -F'\t' '$2!="completed" {print $1}')"
                if [ -z "$pending" ]; then
                  echo "All Verify checks passed on ${SHA}:"
                  printf '%s\n' "$jobs" | awk -F'\t' '{print "  "$1": "$3}'
                  exit 0
                fi
                echo "waiting on: $(printf '%s' "$pending" | tr '\n' ' ')"
              else
                echo "Verify run ${run_id} has no jobs yet, waiting..."
              fi
            else
              # A push always starts one, so this is scheduling delay rather
              # than absence — but do not wait forever for something that may
              # never appear.
              echo "no Verify run for ${SHA} yet, waiting..."
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::timed out waiting for the Verify checks on ${SHA}"
              exit 1
            fi
            sleep 20
          done

  check-llm-secrets:
    # Same fail-fast as in validate.yml — refuse to deploy if neither
    # LLM API key is configured. The pod's render-config init container
    # would also reject this case, but failing here saves a full
    # tofu-apply + image-push + rollout cycle.
    name: At least one LLM API key configured
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check MISTRAL_API_KEY or MINIMAX_API_KEY
        env:
          MISTRAL: ${{ secrets.MISTRAL_API_KEY }}
          MINIMAX: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [ -z "$MISTRAL" ] && [ -z "$MINIMAX" ]; then
            echo "::error::Neither MISTRAL_API_KEY nor MINIMAX_API_KEY is set in the 'dev' environment. openclaw needs at least one."
            exit 1
          fi
          echo "OK — at least one LLM API key is configured."

  tofu-apply:
    name: OpenTofu Apply
    needs: [check-llm-secrets, wait-for-verify]
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read TOFU_VERSION from /VERSIONS
        id: tfver
        run: |
          echo "version=$(grep '^TOFU_VERSION=' VERSIONS | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ steps.tfver.outputs.version }}
          tofu_wrapper: true

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set OpenTofu environment variables
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_USE_AZUREAD_AUTH=true" >> $GITHUB_ENV
          # The BACKEND and the azurerm provider read this from the
          # environment. Without it they fall through to AzureCLICredential,
          # which runs `az account get-access-token` with both --subscription
          # and --tenant and fails with "Please specify only one of
          # subscription and tenant, not both" — an error that names neither
          # OIDC nor the backend and reads like a broken az install.
          echo "ARM_USE_OIDC=true" >> $GITHUB_ENV
          echo "TF_VAR_env=dev" >> $GITHUB_ENV
          # The state-encryption key provider does NOT read ARM_* from the
          # environment the way the backend and the azurerm provider do — it
          # takes block arguments, fed from these TF_VARs. Without them it
          # falls through to AzureCLICredential and fails in CI.
          echo "TF_VAR_use_oidc=true" >> $GITHUB_ENV
          echo "TF_VAR_arm_client_id=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_arm_tenant_id=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV

      - name: OpenTofu Init
        run: |
          tofu init \
            -backend-config="resource_group_name=terraform" \
            -backend-config="storage_account_name=mytofustates" \
            -backend-config="container_name=claw-code" \
            -backend-config="key=dev.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: OpenTofu Plan
        run: tofu plan -out=tfplan

      - name: OpenTofu Apply
        run: tofu apply -auto-approve tfplan

      - name: Upload OpenTofu Output
        run: tofu output -json > tofu_output.json

      - name: Upload OpenTofu Output artifact
        uses: actions/upload-artifact@v7
        with:
          name: tofu-output
          path: tofu_output.json
          retention-days: 30

      - name: Azure logout
        if: always()
        run: |
          az logout
          rm -rf ~/.azure 2>/dev/null || true

  build-and-push-image:
    name: Build and Push Docker image to ACR
    needs: tofu-apply
    # NATIVE ARM64, not QEMU. The image is linux/arm64 and this used to build
    # it on an x86 runner through buildkit's emulator, which made every one of
    # the 91 steps slower and eventually broke one outright: the mermaid smoke
    # render launches Chromium, and under emulation it exceeded puppeteer's
    # 30s timeout and failed the build.
    #
    # That was never a renderer fault — the same check passes natively. Running
    # on an arm64 runner removes the emulator rather than raising a timeout to
    # accommodate it, and speeds up the whole build rather than just that step.
    runs-on: ubuntu-24.04-arm
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name clwcodecodevdev2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Ensure openclaw-base is mirrored from GHCR into ACR
        run: |
          set -euo pipefail
          OPENCLAW_UPSTREAM=$(grep '^OPENCLAW_UPSTREAM=' VERSIONS | cut -d= -f2)
          SRC_TAG="${OPENCLAW_UPSTREAM#v}"
          if az acr repository show \
               --name clwcodecodevdev2 \
               --image "openclaw/openclaw-base:${OPENCLAW_UPSTREAM}" >/dev/null 2>&1; then
            echo "openclaw/openclaw-base:${OPENCLAW_UPSTREAM} already present in ACR — skipping import"
          else
            az acr import \
              --name clwcodecodevdev2 \
              --source "ghcr.io/openclaw/openclaw:${SRC_TAG}" \
              --image "openclaw/openclaw-base:${OPENCLAW_UPSTREAM}"
          fi

      - name: Read version pins from /VERSIONS
        id: version
        run: |
          set -euo pipefail
          SHORT_SHA="${{ github.sha }}"
          echo "short_sha=${SHORT_SHA:0:8}" >> $GITHUB_OUTPUT
          for key in OPENCLAW_UPSTREAM OPENCLAW_VERSION \
                     ALIYUN_CLI_VERSION \
                     AWS_CLI_VERSION \
                     AZDO_MCP_VERSION \
                     AZ_VERSION \
                     BANDIT_VERSION \
                     CODE_SERVER_VERSION \
                     DOTNET_SDK_VERSION \
                     GCLOUD_VERSION \
                     GH_CLI_VERSION \
                     GITEA_MCP_VERSION \
                     GITHUB_MCP_SERVER_VERSION \
                     GITLEAKS_VERSION \
                     GIT_LFS_VERSION \
                     KUBELOGIN_VERSION \
                     MERMAID_CLI_VERSION \
                     NUCLEI_TEMPLATES_VERSION \
                     NUCLEI_VERSION \
                     OPENTOFU_MCP_VERSION \
                     OPENTOFU_VERSION \
                     PESTER_VERSION \
                     PIP_AUDIT_VERSION \
                     PSSCRIPTANALYZER_VERSION \
                     PWSH_VERSION \
                     PYMONGO_VERSION \
                     SEMGREP_MCP_VERSION \
                     SEMGREP_VERSION \
                     SQLPACKAGE_VERSION \
                     TEA_VERSION \
                     TERRAFORM_MCP_VERSION \
                     TERRAFORM_VERSION \
                     TESTSSL_VERSION; do
            echo "${key}=$(grep "^${key}=" VERSIONS | cut -d= -f2)" >> $GITHUB_OUTPUT
          done

      - name: Skip the build if this version is already in ACR
        id: built
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.OPENCLAW_VERSION }}"
          # THE POINT OF THIS STEP. Most merges change manifests, workflows or
          # documentation and not the image at all, and rebuilding ~1.8GB of
          # toolchain to publish a byte-identical layer set costs the better
          # part of twenty minutes for nothing. The image is published under
          # OPENCLAW_VERSION, so "is that tag already in ACR" is exactly the
          # question "has this image been built".
          #
          # The consequence is a rule, not a convenience: A CHANGE UNDER
          # builder/ THAT MUST REACH THE CLUSTER REQUIRES BUMPING
          # OPENCLAW_VERSION. Leave it alone and the deploy will reuse what is
          # already there — correctly, because nothing said otherwise.
          if az acr repository show \
               --name clwcodecodevdev2 \
               --image "openclaw/claw-code:${TAG}" >/dev/null 2>&1; then
            echo ">> openclaw/claw-code:${TAG} already in ACR — skipping the build"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo ">> openclaw/claw-code:${TAG} is not built yet"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip the cron build if this version is already in ACR
        id: builtcron
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.OPENCLAW_VERSION }}"
          if az acr repository show \
               --name clwcodecodevdev2 \
               --image "openclaw/claw-code-cron:${TAG}" >/dev/null 2>&1; then
            echo ">> openclaw/claw-code-cron:${TAG} already in ACR — skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push the cron image
        # A SEPARATE, TINY IMAGE for the CronJobs. They do not run agents —
        # they find the openclaw pod and `kubectl exec` into it — so the whole
        # agent toolchain is weight they never touch. The full image is ~1.8GB
        # and these fire every few minutes; on python:3.12-alpine plus kubectl
        # the same work is a fraction of the pull.
        #
        # Same OPENCLAW_VERSION and the same skip: one tag, one decision about
        # whether either image needs rebuilding.
        if: steps.builtcron.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./builder
          file: ./builder/cron/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/openclaw/claw-code-cron:latest
            ${{ env.REGISTRY }}/openclaw/claw-code-cron:${{ steps.version.outputs.OPENCLAW_VERSION }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image
        if: steps.built.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./builder
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.OPENCLAW_VERSION }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/openclaw/openclaw-base:${{ steps.version.outputs.OPENCLAW_UPSTREAM }}
            ALIYUN_CLI_VERSION=${{ steps.version.outputs.ALIYUN_CLI_VERSION }}
            AWS_CLI_VERSION=${{ steps.version.outputs.AWS_CLI_VERSION }}
            AZDO_MCP_VERSION=${{ steps.version.outputs.AZDO_MCP_VERSION }}
            AZ_VERSION=${{ steps.version.outputs.AZ_VERSION }}
            BANDIT_VERSION=${{ steps.version.outputs.BANDIT_VERSION }}
            CODE_SERVER_VERSION=${{ steps.version.outputs.CODE_SERVER_VERSION }}
            DOTNET_SDK_VERSION=${{ steps.version.outputs.DOTNET_SDK_VERSION }}
            GCLOUD_VERSION=${{ steps.version.outputs.GCLOUD_VERSION }}
            GH_CLI_VERSION=${{ steps.version.outputs.GH_CLI_VERSION }}
            GITEA_MCP_VERSION=${{ steps.version.outputs.GITEA_MCP_VERSION }}
            GITHUB_MCP_SERVER_VERSION=${{ steps.version.outputs.GITHUB_MCP_SERVER_VERSION }}
            GITLEAKS_VERSION=${{ steps.version.outputs.GITLEAKS_VERSION }}
            GIT_LFS_VERSION=${{ steps.version.outputs.GIT_LFS_VERSION }}
            KUBELOGIN_VERSION=${{ steps.version.outputs.KUBELOGIN_VERSION }}
            MERMAID_CLI_VERSION=${{ steps.version.outputs.MERMAID_CLI_VERSION }}
            NUCLEI_TEMPLATES_VERSION=${{ steps.version.outputs.NUCLEI_TEMPLATES_VERSION }}
            NUCLEI_VERSION=${{ steps.version.outputs.NUCLEI_VERSION }}
            OPENTOFU_MCP_VERSION=${{ steps.version.outputs.OPENTOFU_MCP_VERSION }}
            OPENTOFU_VERSION=${{ steps.version.outputs.OPENTOFU_VERSION }}
            PESTER_VERSION=${{ steps.version.outputs.PESTER_VERSION }}
            PIP_AUDIT_VERSION=${{ steps.version.outputs.PIP_AUDIT_VERSION }}
            PSSCRIPTANALYZER_VERSION=${{ steps.version.outputs.PSSCRIPTANALYZER_VERSION }}
            PWSH_VERSION=${{ steps.version.outputs.PWSH_VERSION }}
            PYMONGO_VERSION=${{ steps.version.outputs.PYMONGO_VERSION }}
            SEMGREP_MCP_VERSION=${{ steps.version.outputs.SEMGREP_MCP_VERSION }}
            SEMGREP_VERSION=${{ steps.version.outputs.SEMGREP_VERSION }}
            SQLPACKAGE_VERSION=${{ steps.version.outputs.SQLPACKAGE_VERSION }}
            TEA_VERSION=${{ steps.version.outputs.TEA_VERSION }}
            TERRAFORM_MCP_VERSION=${{ steps.version.outputs.TERRAFORM_MCP_VERSION }}
            TERRAFORM_VERSION=${{ steps.version.outputs.TERRAFORM_VERSION }}
            TESTSSL_VERSION=${{ steps.version.outputs.TESTSSL_VERSION }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure logout
        if: always()
        run: |
          az logout
          rm -rf ~/.azure 2>/dev/null || true

  apply-secrets:
    name: Apply claw-code-secrets to cluster
    # Runs after the infrastructure exists (the cluster has to be there to
    # apply into) and IN PARALLEL with the image build, which needs nothing
    # from it — so reconciling the Secret costs no wall-clock.
    #
    # This used to be a separate workflow, triggered by hand. The cluster was
    # then recreated by the region move, the Secret went with it — it lives
    # only in the cluster, not in git and not in OpenTofu state — and no one
    # re-ran it. The deploy did not report that: it applied every manifest,
    # then spent ten minutes reaching the deployment progress deadline while
    # the render-config init container crashlooped on a missing API key and
    # all three CronJob pods sat in CreateContainerConfigError.
    #
    # Reconciling it on every deploy removes that failure mode. Re-applying an
    # unchanged Secret is a no-op, so doing it every time costs nothing.
    needs: tofu-apply
    runs-on: ubuntu-latest
    environment: dev
    env:
      KUBECONFIG: /tmp/kubeconfig

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group claw-code \
            --name claw-code-aks \
            --file /tmp/kubeconfig \
            --admin

      - name: Install kubectl
        run: |
          ARCH=$(dpkg --print-architecture)
          mkdir -p "$HOME/.local/bin"
          KUBECTL_VERSION="$(curl -sL https://dl.k8s.io/release/stable.txt)"
          curl -sLo "$HOME/.local/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply claw-code-secrets
        env:
          MISTRAL_API_KEY:         ${{ secrets.MISTRAL_API_KEY }}
          MINIMAX_API_KEY:         ${{ secrets.MINIMAX_API_KEY }}
          MOONSHOT_API_KEY:        ${{ secrets.MOONSHOT_API_KEY }}
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          # secrets.GITHUB_TOKEN is reserved by GitHub Actions (returns the
          # auto-generated workflow token, not our bot PAT). Use the
          # explicit BOT_GITHUB_TOKEN secret and apply it under the same
          # k8s-side key name (GITHUB_TOKEN) that openclaw expects.
          GITHUB_TOKEN:            ${{ secrets.BOT_GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ENTRA_TENANT_ID:         ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_USERNAME:          ${{ secrets.ENTRA_USERNAME }}
          ENTRA_PASSWORD:          ${{ secrets.ENTRA_PASSWORD }}
          ENTRA_TOTP_SEED:         ${{ secrets.ENTRA_TOTP_SEED }}
        run: |
          kubectl create secret generic claw-code-secrets \
            --namespace claw-code \
            --dry-run=client \
            --from-literal=MISTRAL_API_KEY="$MISTRAL_API_KEY" \
            --from-literal=MINIMAX_API_KEY="$MINIMAX_API_KEY" \
            --from-literal=MOONSHOT_API_KEY="$MOONSHOT_API_KEY" \
            --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --from-literal=GITHUB_TOKEN="$GITHUB_TOKEN" \
            --from-literal=TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            --from-literal=ENTRA_TENANT_ID="$ENTRA_TENANT_ID" \
            --from-literal=ENTRA_USERNAME="$ENTRA_USERNAME" \
            --from-literal=ENTRA_PASSWORD="$ENTRA_PASSWORD" \
            --from-literal=ENTRA_TOTP_SEED="$ENTRA_TOTP_SEED" \
            -o yaml \
          | kubectl apply -f -

  deploy-to-aks:
    name: Deploy to AKS (apply manifests + rollout)
    # Both, not just the image: the manifests reference claw-code-secrets, and
    # a pod that rolls before the Secret exists crashloops instead of starting.
    needs: [build-and-push-image, apply-secrets]
    runs-on: ubuntu-latest
    environment: dev
    env:
      KUBECONFIG: /tmp/kubeconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group claw-code \
            --name claw-code-aks \
            --file /tmp/kubeconfig \
            --admin

      - name: Install kubectl
        run: |
          ARCH=$(dpkg --print-architecture)
          mkdir -p "$HOME/.local/bin"
          KUBECTL_VERSION="$(curl -sL https://dl.k8s.io/release/stable.txt)"
          curl -sLo "$HOME/.local/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download the OpenTofu outputs
        # Produced by the apply job. The deploy needs two values out of it and
        # cannot recompute them: they describe infrastructure, not the repo.
        uses: actions/download-artifact@v8
        with:
          name: tofu-output

      - name: Substitute the OpenTofu outputs the manifests need
        run: |
          set -euo pipefail
          # The pod reaches Cosmos with workload identity, so two values have
          # to come from the apply that created them: the identity to exchange
          # its token for, and the endpoint to talk to. Both are placeholders
          # in git because neither exists until the infrastructure does.
          CLIENT_ID=$(jq -r '.pod_identity_client_id.value // empty' tofu_output.json)
          ENDPOINT=$(jq -r '.planning_cosmos_endpoint.value // empty' tofu_output.json)
          if [ -z "$CLIENT_ID" ] || [ -z "$ENDPOINT" ]; then
            echo "::error::pod_identity_client_id or planning_cosmos_endpoint missing from the OpenTofu outputs"
            exit 1
          fi
          sed -i "s|PLACEHOLDER_POD_CLIENT_ID|${CLIENT_ID}|g" k8s/020-deployment.yaml
          sed -i "s|PLACEHOLDER_COSMOS_ENDPOINT|${ENDPOINT}|g" k8s/020-deployment.yaml
          # The image tag, so the manifests name an IMMUTABLE version rather
          # than :latest. Without this the placeholder would reach the cluster
          # literally and no pod could pull.
          # Read from /VERSIONS, NOT from steps.version — that step belongs to
          # the build job, and a steps.* reference across jobs resolves to
          # empty. The tag would have become "" and every manifest would have
          # named an image with no tag at all.
          TAG="$(grep '^OPENCLAW_VERSION=' VERSIONS | cut -d= -f2)"
          [ -n "$TAG" ] || { echo "::error::OPENCLAW_VERSION missing from VERSIONS"; exit 1; }
          sed -i "s|PLACEHOLDER_IMAGE_TAG|${TAG}|g" k8s/*.yaml
          echo ">> images pinned to ${TAG}"
          echo ">> workload identity ${CLIENT_ID}, planning store ${ENDPOINT}"

      - name: Assemble TOOLS.md and stamp content checksums into the pod template
        # Why this runs BEFORE the apply: the checksums have to be in the
        # manifest that gets applied, otherwise the pod template does not change
        # and nothing re-rolls.
        #
        # TOOLS.md is assembled HERE rather than in its own step further down so
        # that the hash covers the exact bytes that ship. Hashing the source
        # files instead would miss a reordering of the concatenation, which
        # changes the file the pod reads while leaving every input identical.
        #
        # The script list is resolved from builder/kustomization.yaml by the
        # same awk the ConfigMap step uses — one source, so the two cannot
        # disagree about which files are shipped.
        run: |
          set -euo pipefail

          mkdir -p /tmp/tools-md
          cat \
            k8s/tools/TOOLS.md \
            k8s/tools/TOOLS-gitflow.md \
            k8s/tools/TOOLS-github.md \
            k8s/tools/TOOLS-gitlab.md \
            k8s/tools/TOOLS-entra.md \
            k8s/tools/TOOLS-aws.md \
            k8s/tools/TOOLS-gcp.md \
            k8s/tools/TOOLS-alicloud.md \
            k8s/tools/TOOLS-k8s.md \
            k8s/tools/TOOLS-terraform.md \
            k8s/tools/TOOLS-vscode.md \
            k8s/tools/TOOLS-debug.md \
            > /tmp/tools-md/TOOLS.md
          echo "Assembled TOOLS.md is $(wc -c < /tmp/tools-md/TOOLS.md) bytes ($(wc -l < /tmp/tools-md/TOOLS.md) lines)."

          mapfile -t files < <(
            for cm in claw-scripts-planner claw-scripts-runner; do
              awk -v cm="$cm" '
                $0 ~ "name: " cm "$" { inblk = 1; next }
                inblk && /^  - name:/ { inblk = 0 }
                inblk && /^ *- [^ ]+=[^ ]+$/ {
                  gsub(/^ *- /, "");
                  split($0, kv, "=");
                  print "builder/" kv[2]
                }
              ' builder/kustomization.yaml
            done | sort -u
          )
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no script files resolved from builder/kustomization.yaml"; exit 1; }

          # Hash names as well as contents, so a rename re-rolls too.
          SCRIPTS_SUM="$(sha256sum "${files[@]}" | sha256sum | cut -c1-16)"
          TOOLS_SUM="$(sha256sum /tmp/tools-md/TOOLS.md | cut -c1-16)"
          echo "scripts checksum: $SCRIPTS_SUM (${#files[@]} files)"
          echo "tools-md checksum: $TOOLS_SUM"

          sed -i "s|PLACEHOLDER_SCRIPTS_SUM|${SCRIPTS_SUM}|g" k8s/*.yaml
          sed -i "s|PLACEHOLDER_TOOLS_SUM|${TOOLS_SUM}|g" k8s/*.yaml
          grep -q PLACEHOLDER_ k8s/*.yaml && { echo "::error::a PLACEHOLDER_ survived substitution"; exit 1; } || true

      - name: Ship builder/ scripts as ConfigMaps
        # THE POINT: a change to a script reaches the cluster on the next tick,
        # without rebuilding a ~1.8GB image for a one-line edit. The image
        # still carries every one of these files, so a ConfigMap that fails to
        # mount degrades to the version baked in — stale, never missing.
        #
        # THE FILE LIST IS READ FROM builder/kustomization.yaml, not repeated
        # here. It WAS repeated here, and it drifted: the forge split added
        # forge_github, forge_gitlab, forge_gitea and forge_azdo, and the
        # planner ConfigMap silently shipped without them — so forge.py from
        # the mount would have imported its host modules from the IMAGE,
        # mixing two versions of one layer. One source makes that impossible
        # rather than merely unlikely.
        #
        # SERVER-SIDE APPLY is not optional. A client-side apply stores the
        # ENTIRE object in the kubectl.kubernetes.io/last-applied-configuration
        # annotation, and annotations cap at 256KB:
        #
        #   The ConfigMap "claw-scripts-runner" is invalid:
        #   metadata.annotations: Too long: may not be more than 262144 bytes
        #
        # Both halves exceed that (372KB and 470KB). Server-side apply keeps
        # that state in managedFields, so the limit that matters becomes
        # etcd's 1MiB for the object rather than 256KB for a copy inside it.
        run: |
          set -euo pipefail
          for cm in claw-scripts-planner claw-scripts-runner; do
            mapfile -t args < <(
              awk -v cm="$cm" '
                $0 ~ "name: " cm "$" { inblk = 1; next }
                inblk && /^  - name:/ { inblk = 0 }
                inblk && /^ *- [^ ]+=[^ ]+$/ {
                  gsub(/^ *- /, "");
                  split($0, kv, "=");
                  printf "--from-file=%s=builder/%s\n", kv[1], kv[2]
                }
              ' builder/kustomization.yaml
            )
            [ "${#args[@]}" -gt 0 ] || { echo "::error::no files resolved for $cm"; exit 1; }
            echo ">> $cm: ${#args[@]} file(s)"
            kubectl create configmap "$cm" \
              --namespace claw-code \
              "${args[@]}" \
              --dry-run=client -o yaml \
              | kubectl apply --server-side --force-conflicts -f -
          done

      - name: Build and apply openclaw-tools-md ConfigMap from k8s/tools/
        # The per-tool TOOLS-*.md files are the bot's self-description;
        # they're concatenated into a single TOOLS.md key on the
        # openclaw-tools-md ConfigMap, mounted read-only at
        # ~/.openclaw/workspace/TOOLS.md by the openclaw container
        # (subPath file mount in 020-deployment.yaml).
        #
        # Order matters: TOOLS.md is the index/header, then gitflow first
        # (foundational rules), then host-specific docs, then capability
        # docs. Keep this list in sync with k8s/tools/.
        run: |
          set -euo pipefail
          # Assembled by the checksum step above, so the bytes hashed into the
          # pod annotation and the bytes shipped here are the same bytes.
          test -s /tmp/tools-md/TOOLS.md
          kubectl create configmap claw-code-tools-md \
            --namespace claw-code \
            --from-file=TOOLS.md=/tmp/tools-md/TOOLS.md \
            --dry-run=client -o yaml \
          | kubectl apply -f -

      # ORDER MATTERS: the ConfigMaps go on BEFORE the Deployment.
      #
      # The Deployment now carries a checksum of this content in its pod
      # template, so applying it re-rolls the pod. If the ConfigMaps were
      # applied afterwards (as they were), that new pod would come up mounting
      # the PREVIOUS content — and subPath mounts, which TOOLS.md uses, never
      # refresh in place, so it would keep serving the stale file for the whole
      # life of the pod. Applying them first means the pod that the checksum
      # change rolls is the pod that mounts the content the checksum describes.
      - name: Apply k8s/ manifests
        # `-f k8s/` is non-recursive: the per-tool markdown files under
        # k8s/tools/ are skipped here (they're not YAML manifests). They were
        # already assembled into a ConfigMap above via `kubectl create
        # --from-file`, which is the right tool for binary-ish multi-file
        # payloads we don't want to hand-inline into YAML.
        run: kubectl apply -f k8s/

      - name: Wait for the claw-code rollout to settle
        # NO `kubectl rollout restart` here, deliberately.
        #
        # It used to run unconditionally, because the image was `:latest`: the
        # manifest was byte-identical every deploy, so an apply changed nothing
        # and the pod had to be forced to re-pull. That forced a full pod
        # replacement on EVERY deploy — ~5 minutes on a 2-vCPU node with a
        # Recreate strategy, even when the deploy changed nothing at all.
        #
        # The image is now pinned to an immutable tag and the ConfigMap content
        # is hashed into the pod template, so `apply` re-rolls exactly when
        # something the pod actually runs has changed. When nothing changed,
        # this returns immediately against the already-Available deployment.
        run: |
          kubectl rollout status deployment/claw-code -n claw-code --timeout=15m

      - name: Azure logout
        if: always()
        run: |
          az logout
          rm -rf ~/.azure 2>/dev/null || true
