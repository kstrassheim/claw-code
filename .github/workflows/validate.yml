name: Validate (Pull Request)

# Runs on every PR to main. Three independent validation jobs in parallel:
#   - check-llm-secrets : fail the PR if neither LLM API key secret is set
#   - tofu-plan    : init, validate, plan against current main state
#   - docker-build      : build the image locally without pushing to ACR
# None of these jobs change anything in Azure or the cluster.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Intentionally NO `paths:` filter here. Both `Docker Build (no push)`
  # and `OpenTofu Plan` are required status checks on the main ruleset.
  # If a PR doesn't touch any path the workflow cares about (e.g. a
  # README-only change), GitHub waits forever for those checks to
  # report a status and the PR is stuck unmergeable. Always running
  # the jobs and letting the build cache do its job is cheaper than
  # explaining "why is my PR blocked" three times a week.

env:
  REGISTRY: clwcodecodevdev2.azurecr.io
  IMAGE_NAME: openclaw/claw-code

permissions:
  id-token: write
  contents: read

jobs:
  check-llm-secrets:
    # openclaw needs at least one LLM API key to render a usable config.
    # The pod's render-config init container fails-fast in this case too,
    # but catching it at PR time avoids merging a broken cluster state.
    name: At least one LLM API key configured
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check MISTRAL_API_KEY or MINIMAX_API_KEY
        env:
          MISTRAL: ${{ secrets.MISTRAL_API_KEY }}
          MINIMAX: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [ -z "$MISTRAL" ] && [ -z "$MINIMAX" ]; then
            echo "::error::Neither MISTRAL_API_KEY nor MINIMAX_API_KEY is set in the 'dev' environment. openclaw needs at least one."
            exit 1
          fi
          echo "OK — at least one LLM API key is configured."

  tofu-plan:
    # PULL REQUESTS ONLY. The deploy applies the same state on push, and both
    # take the state lock — running them together made the deploy fail with
    # "state blob is already locked" on the very merge that was meant to
    # provision everything. The plan is a pre-merge gate; after the merge the
    # apply is the authority, and a plan alongside it is redundant as well as
    # racy.
    if: github.event_name == 'pull_request'
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read TOFU_VERSION from /VERSIONS
        id: tfver
        run: |
          echo "version=$(grep '^TOFU_VERSION=' VERSIONS | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ steps.tfver.outputs.version }}
          tofu_wrapper: true

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set OpenTofu environment variables
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_USE_AZUREAD_AUTH=true" >> $GITHUB_ENV
          # The BACKEND and the azurerm provider read this from the
          # environment. Without it they fall through to AzureCLICredential,
          # which runs `az account get-access-token` with both --subscription
          # and --tenant and fails with "Please specify only one of
          # subscription and tenant, not both" — an error that names neither
          # OIDC nor the backend and reads like a broken az install.
          echo "ARM_USE_OIDC=true" >> $GITHUB_ENV
          echo "TF_VAR_env=dev" >> $GITHUB_ENV
          # The state-encryption key provider does NOT read ARM_* from the
          # environment the way the backend and the azurerm provider do — it
          # takes block arguments, fed from these TF_VARs. Without them it
          # falls through to AzureCLICredential and fails in CI.
          echo "TF_VAR_use_oidc=true" >> $GITHUB_ENV
          echo "TF_VAR_arm_client_id=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_arm_tenant_id=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV

      - name: OpenTofu Init
        run: |
          tofu init \
            -backend-config="resource_group_name=terraform" \
            -backend-config="storage_account_name=mytofustates" \
            -backend-config="container_name=claw-code" \
            -backend-config="key=dev.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: OpenTofu Validate
        run: tofu validate

      - name: OpenTofu Plan
        run: tofu plan -out=tfplan

      - name: Upload OpenTofu Plan artifact
        uses: actions/upload-artifact@v6
        with:
          name: tofu-plan
          path: tfplan
          retention-days: 7

      - name: Plan Summary
        run: |
          echo "## OpenTofu Plan Summary" >> $GITHUB_STEP_SUMMARY
          tofu show --json tfplan 2>/dev/null | \
            jq -r '[
              (.resources | length) as $total |
              "### Resources: \($total)",
              "",
              (.resource_changes | group_by(.type) | map("\(.[0].type): \(length)") | join("\n"))
            ] | join("\n")' >> $GITHUB_STEP_SUMMARY || true

      - name: Azure logout
        if: always()
        run: |
          az logout
          rm -rf ~/.azure 2>/dev/null || true

  docker-build:
    name: Docker Build (no push)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR (needed to pull the openclaw-base image)
        id: acr
        run: |
          set -uo pipefail
          # BOOTSTRAP. This job builds FROM a base image held in the project's
          # own registry, so on a pull request that has not created the
          # registry yet there is nothing to log in to and nothing to pull.
          # Failing here would block the very PR that provisions it.
          if az acr show --name clwcodecodevdev2 >/dev/null 2>&1; then
            az acr login --name clwcodecodevdev2
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
            {
              echo "## Docker build skipped"
              echo
              echo "The registry \`clwcodecodevdev2\` does not exist yet, so the base"
              echo "image this Dockerfile builds FROM cannot be pulled and **the image"
              echo "was not validated by this run**."
              echo
              echo "This is expected only while bootstrapping. Once the apply has created"
              echo "the registry, this job builds normally on every pull request."
            } >> $GITHUB_STEP_SUMMARY
            echo "::warning::registry not provisioned yet — the image was NOT built or validated"
          fi

      - name: Set up Docker Buildx
        if: steps.acr.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Ensure openclaw-base is mirrored from GHCR into ACR
        if: steps.acr.outputs.present == 'true'
        # The Dockerfile's FROM points at our ACR, so the base must exist
        # there before any build (PR or main) can resolve it.
        run: |
          set -euo pipefail
          OPENCLAW_UPSTREAM=$(grep '^OPENCLAW_UPSTREAM=' VERSIONS | cut -d= -f2)
          SRC_TAG="${OPENCLAW_UPSTREAM#v}"
          if az acr repository show \
               --name clwcodecodevdev2 \
               --image "openclaw/openclaw-base:${OPENCLAW_UPSTREAM}" >/dev/null 2>&1; then
            echo "openclaw/openclaw-base:${OPENCLAW_UPSTREAM} already present in ACR — skipping import"
          else
            az acr import \
              --name clwcodecodevdev2 \
              --source "ghcr.io/openclaw/openclaw:${SRC_TAG}" \
              --image "openclaw/openclaw-base:${OPENCLAW_UPSTREAM}"
          fi

      - name: Read version pins from /VERSIONS
        id: version
        run: |
          set -euo pipefail
          for key in OPENCLAW_UPSTREAM OPENCLAW_VERSION \
                     ALIYUN_CLI_VERSION \
                     AWS_CLI_VERSION \
                     AZ_ACCOUNTS_VERSION \
                     AZ_AUTOMATION_VERSION \
                     AZ_DATAFACTORY_VERSION \
                     AZ_SYNAPSE_VERSION \
                     BANDIT_VERSION \
                     CODE_SERVER_VERSION \
                     DOTNET_SDK_VERSION \
                     GCLOUD_VERSION \
                     GH_CLI_VERSION \
                     GITHUB_MCP_SERVER_VERSION \
                     GITLEAKS_VERSION \
                     GIT_LFS_VERSION \
                     KUBELOGIN_VERSION \
                     MERMAID_CLI_VERSION \
                     NUCLEI_TEMPLATES_VERSION \
                     NUCLEI_VERSION \
                     OPENTOFU_MCP_VERSION \
                     OPENTOFU_VERSION \
                     PESTER_VERSION \
                     PIP_AUDIT_VERSION \
                     PSSCRIPTANALYZER_VERSION \
                     PWSH_VERSION \
                     PYMONGO_VERSION \
                     SEMGREP_MCP_VERSION \
                     SEMGREP_VERSION \
                     SQLPACKAGE_VERSION \
                     TERRAFORM_MCP_VERSION \
                     TERRAFORM_VERSION \
                     TESTSSL_VERSION; do
            echo "${key}=$(grep "^${key}=" VERSIONS | cut -d= -f2)" >> $GITHUB_OUTPUT
          done

      - name: Build Docker image (no push)
        # Nothing to build FROM until the registry exists — see the login step.
        if: steps.acr.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./builder
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          load: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/openclaw/openclaw-base:${{ steps.version.outputs.OPENCLAW_UPSTREAM }}
            ALIYUN_CLI_VERSION=${{ steps.version.outputs.ALIYUN_CLI_VERSION }}
            AWS_CLI_VERSION=${{ steps.version.outputs.AWS_CLI_VERSION }}
            AZ_ACCOUNTS_VERSION=${{ steps.version.outputs.AZ_ACCOUNTS_VERSION }}
            AZ_AUTOMATION_VERSION=${{ steps.version.outputs.AZ_AUTOMATION_VERSION }}
            AZ_DATAFACTORY_VERSION=${{ steps.version.outputs.AZ_DATAFACTORY_VERSION }}
            AZ_SYNAPSE_VERSION=${{ steps.version.outputs.AZ_SYNAPSE_VERSION }}
            BANDIT_VERSION=${{ steps.version.outputs.BANDIT_VERSION }}
            CODE_SERVER_VERSION=${{ steps.version.outputs.CODE_SERVER_VERSION }}
            DOTNET_SDK_VERSION=${{ steps.version.outputs.DOTNET_SDK_VERSION }}
            GCLOUD_VERSION=${{ steps.version.outputs.GCLOUD_VERSION }}
            GH_CLI_VERSION=${{ steps.version.outputs.GH_CLI_VERSION }}
            GITHUB_MCP_SERVER_VERSION=${{ steps.version.outputs.GITHUB_MCP_SERVER_VERSION }}
            GITLEAKS_VERSION=${{ steps.version.outputs.GITLEAKS_VERSION }}
            GIT_LFS_VERSION=${{ steps.version.outputs.GIT_LFS_VERSION }}
            KUBELOGIN_VERSION=${{ steps.version.outputs.KUBELOGIN_VERSION }}
            MERMAID_CLI_VERSION=${{ steps.version.outputs.MERMAID_CLI_VERSION }}
            NUCLEI_TEMPLATES_VERSION=${{ steps.version.outputs.NUCLEI_TEMPLATES_VERSION }}
            NUCLEI_VERSION=${{ steps.version.outputs.NUCLEI_VERSION }}
            OPENTOFU_MCP_VERSION=${{ steps.version.outputs.OPENTOFU_MCP_VERSION }}
            OPENTOFU_VERSION=${{ steps.version.outputs.OPENTOFU_VERSION }}
            PESTER_VERSION=${{ steps.version.outputs.PESTER_VERSION }}
            PIP_AUDIT_VERSION=${{ steps.version.outputs.PIP_AUDIT_VERSION }}
            PSSCRIPTANALYZER_VERSION=${{ steps.version.outputs.PSSCRIPTANALYZER_VERSION }}
            PWSH_VERSION=${{ steps.version.outputs.PWSH_VERSION }}
            PYMONGO_VERSION=${{ steps.version.outputs.PYMONGO_VERSION }}
            SEMGREP_MCP_VERSION=${{ steps.version.outputs.SEMGREP_MCP_VERSION }}
            SEMGREP_VERSION=${{ steps.version.outputs.SEMGREP_VERSION }}
            SQLPACKAGE_VERSION=${{ steps.version.outputs.SQLPACKAGE_VERSION }}
            TERRAFORM_MCP_VERSION=${{ steps.version.outputs.TERRAFORM_MCP_VERSION }}
            TERRAFORM_VERSION=${{ steps.version.outputs.TERRAFORM_VERSION }}
            TESTSSL_VERSION=${{ steps.version.outputs.TESTSSL_VERSION }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure logout
        if: always()
        run: |
          az logout
          rm -rf ~/.azure 2>/dev/null || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - name: Install git
        # The checkout tests drive REAL git against a real repository rather
        # than a mock, because the block they pin is the one that once
        # discarded work. No pip install: the suite is standard-library
        # unittest on purpose — the runtime image has no pip packages beyond
        # the store driver, and a suite that only runs where someone
        # remembered to install a framework is a suite that stops being run.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure git identity
        # The checkout tests commit; git refuses to without an identity.
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run the suite
        run: |
          cd builder/tests
          python -m unittest discover -s . -p 'test_*.py' -v

  function-coverage:
    name: Function Coverage Ledger
    runs-on: ubuntu-latest
    container: python:3.12-slim
    # A ledger, not a coverage percentage: half of what ships is shell, and no
    # tool in this image can instrument a bash function. This fails when a NEW
    # untested function appears, so the gap can shrink but never grow
    # silently. Closing gaps is deliberate work; letting them open is not.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Report
        run: python builder/tools/function-inventory.py
      - name: Fail on a new untested function
        run: python builder/tools/function-inventory.py --check

  check-python-names:
    name: Undefined Names
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Scan
        # py_compile accepts an undefined name — it is a runtime NameError. A
        # planner that references a variable which does not exist crashes on
        # every tick, and the only symptom is a stack trace in a CronJob log
        # nobody reads, so the subsystem is dead until someone looks. That
        # happened once; this job is why it cannot happen quietly again.
        run: python builder/tools/check-undefined-names.py

  check-model-config:
    name: Model Config
    runs-on: ubuntu-latest
    container: python:3.12-slim
    # The model configuration is JSON inside a ConfigMap, so it cannot carry
    # comments, and every property it encodes fails SILENTLY when removed — no
    # error, no log line, just a bot that is worse at its job.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Check
        run: python builder/tools/check-model-config.py

  check-tools-docs:
    name: Tools Documentation
    runs-on: ubuntu-latest
    container: python:3.12-slim
    # Both ways a tools document can be written, merged and then never reach
    # the agent: left out of the hook's hardcoded cat list, or silently
    # truncated past the bootstrap cap.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check
        run: python builder/tools/check-tools-docs.py

  verify-skills-locked:
    name: Skills Lockdown
    runs-on: ubuntu-latest
    # Static half of the supply-chain guard: the agent must not be able to
    # grant itself new capabilities at runtime. The dynamic half — actually
    # trying to defeat the lockdown as uid 1000 — runs inside the built image
    # in verify-build, because it needs the image to exist.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check
        run: sh builder/verify-skills-locked.sh

      - name: The lockdown must actually hold
        # Only meaningful when an image was built — see the ACR login step.
        if: steps.acr.outputs.present == 'true'
        # The static check says the manifests are right; this one tries to
        # DEFEAT the real lockdown as uid 1000 inside the real image, and also
        # checks it did not go too far — the agent must still be able to write
        # its own workspace file, or chat dispatch dies with EACCES every turn.
        run: |
          docker run --rm --user 0 \
            -v "$PWD/builder/verify-lockdown-effective.sh:/tmp/verify.sh:ro" \
            --entrypoint sh \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}" \
            /tmp/verify.sh
