name: Validate (Pull Request)

# Runs on every PR to main. Three independent validation jobs in parallel:
#   - check-llm-secrets : fail the PR if neither LLM API key secret is set
#   - terraform-plan    : init, validate, plan against current main state
#   - docker-build      : build the image locally without pushing to ACR
# None of these jobs change anything in Azure or the cluster.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'builder/**'
      - 'k8s/**'
      - 'VERSIONS'
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/validate.yml'

env:
  REGISTRY: clwcodecodevdev1.azurecr.io
  IMAGE_NAME: openclaw/claw-code

permissions:
  id-token: write
  contents: read

jobs:
  check-llm-secrets:
    # openclaw needs at least one LLM API key to render a usable config.
    # The pod's render-config init container fails-fast in this case too,
    # but catching it at PR time avoids merging a broken cluster state.
    name: At least one LLM API key configured
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check MISTRAL_API_KEY or MINIMAX_API_KEY
        env:
          MISTRAL: ${{ secrets.MISTRAL_API_KEY }}
          MINIMAX: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [ -z "$MISTRAL" ] && [ -z "$MINIMAX" ]; then
            echo "::error::Neither MISTRAL_API_KEY nor MINIMAX_API_KEY is set in the 'dev' environment. openclaw needs at least one."
            exit 1
          fi
          echo "OK — at least one LLM API key is configured."

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read TERRAFORM_VERSION from /VERSIONS
        id: tfver
        run: |
          echo "version=$(grep '^TERRAFORM_VERSION=' VERSIONS | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: true

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials for kubernetes/helm providers
        run: |
          az aks get-credentials \
            --resource-group claw-code \
            --name claw-code-aks \
            --file /tmp/kubeconfig_clawcode \
            --admin

      - name: Set Terraform environment variables
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_USE_AZUREAD_AUTH=true" >> $GITHUB_ENV
          echo "TF_VAR_env=dev" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=terraform" \
            -backend-config="storage_account_name=mytofustates" \
            -backend-config="container_name=claw-code" \
            -backend-config="key=dev.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan artifact
        uses: actions/upload-artifact@v6
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 7

      - name: Plan Summary
        run: |
          echo "## Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          terraform show --json tfplan 2>/dev/null | \
            jq -r '[
              (.resources | length) as $total |
              "### Resources: \($total)",
              "",
              (.resource_changes | group_by(.type) | map("\(.[0].type): \(length)") | join("\n"))
            ] | join("\n")' >> $GITHUB_STEP_SUMMARY || true

      - name: Azure logout
        if: always()
        run: |
          az logout
          rm -rf ~/.azure 2>/dev/null || true

  docker-build:
    name: Docker Build (no push)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR (needed to pull the openclaw-base image)
        run: az acr login --name clwcodecodevdev1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure openclaw-base is mirrored from GHCR into ACR
        # The Dockerfile's FROM points at our ACR, so the base must exist
        # there before any build (PR or main) can resolve it.
        run: |
          set -euo pipefail
          OPENCLAW_UPSTREAM=$(grep '^OPENCLAW_UPSTREAM=' VERSIONS | cut -d= -f2)
          SRC_TAG="${OPENCLAW_UPSTREAM#v}"
          if az acr repository show \
               --name clwcodecodevdev1 \
               --image "openclaw/openclaw-base:${OPENCLAW_UPSTREAM}" >/dev/null 2>&1; then
            echo "openclaw/openclaw-base:${OPENCLAW_UPSTREAM} already present in ACR — skipping import"
          else
            az acr import \
              --name clwcodecodevdev1 \
              --source "ghcr.io/openclaw/openclaw:${SRC_TAG}" \
              --image "openclaw/openclaw-base:${OPENCLAW_UPSTREAM}"
          fi

      - name: Read version pins from /VERSIONS
        id: version
        run: |
          set -euo pipefail
          for key in OPENCLAW_UPSTREAM GH_CLI_VERSION GITHUB_MCP_SERVER_VERSION \
                     TERRAFORM_VERSION TERRAFORM_MCP_VERSION CODE_SERVER_VERSION \
                     AWS_CLI_VERSION GCLOUD_VERSION ALIYUN_CLI_VERSION; do
            echo "${key}=$(grep "^${key}=" VERSIONS | cut -d= -f2)" >> $GITHUB_OUTPUT
          done

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./builder
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/openclaw/openclaw-base:${{ steps.version.outputs.OPENCLAW_UPSTREAM }}
            GH_CLI_VERSION=${{ steps.version.outputs.GH_CLI_VERSION }}
            GITHUB_MCP_SERVER_VERSION=${{ steps.version.outputs.GITHUB_MCP_SERVER_VERSION }}
            TERRAFORM_VERSION=${{ steps.version.outputs.TERRAFORM_VERSION }}
            TERRAFORM_MCP_VERSION=${{ steps.version.outputs.TERRAFORM_MCP_VERSION }}
            CODE_SERVER_VERSION=${{ steps.version.outputs.CODE_SERVER_VERSION }}
            AWS_CLI_VERSION=${{ steps.version.outputs.AWS_CLI_VERSION }}
            GCLOUD_VERSION=${{ steps.version.outputs.GCLOUD_VERSION }}
            ALIYUN_CLI_VERSION=${{ steps.version.outputs.ALIYUN_CLI_VERSION }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure logout
        if: always()
        run: |
          az logout
          rm -rf ~/.azure 2>/dev/null || true
