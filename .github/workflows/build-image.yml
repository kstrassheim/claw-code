name: Build Custom OpenClaw Image

on:
  push:
    branches:
      - feature/openclaw-image
      - feature/add-azure-container-reg
    paths:
      - 'builder/**'
      - '.github/workflows/build-image.yml'
      - 'k8s/values.yaml'
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to build (e.g. v2026.5.7 or feature/openclaw-image)'
        required: false
        default: ''

env:
  REGISTRY: clwcodecodevdev1.azurecr.io
  IMAGE_NAME: openclaw/claw-code

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set environment variables for Terraform (Entra auth)
        run: |
          echo "ARM_USE_OIDC=true" >> $GITHUB_ENV
          echo "ARM_USE_AZUREAD_AUTH=true" >> $GITHUB_ENV
          echo "ARM_FEDERATED_TOKEN_FILE=${{ runner.temp }}/azure_federated_token" >> $GITHUB_ENV
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="key=dev.tfstate"

      - name: Terraform Apply (create ACR + supporting infra)
        run: |
          # Target only the ACR resources to avoid k8s/helm provider auth issues
          terraform apply -auto-approve -var="env=dev" -var="unique_suffix=dev1" \
            -target=azurerm_container_registry.acr \
            -target=azurerm_role_assignment.acr_pull


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR (Entra)
        run: az acr login --name clwcodecodevdev1

      - name: Extract version
        id: version
        run: |
          # Read VERSIONS.md for pinned versions
          GH_CLI_VERSION=$(grep '^GH_CLI_VERSION=' VERSIONS.md | cut -d= -f2)
          GITHUB_MCP_SERVER_VERSION=$(grep '^GITHUB_MCP_SERVER_VERSION=' VERSIONS.md | cut -d= -f2)
          TERRAFORM_VERSION=$(grep '^TERRAFORM_VERSION=' VERSIONS.md | cut -d= -f2)
          TERRAFORM_MCP_VERSION=$(grep '^TERRAFORM_MCP_VERSION=' VERSIONS.md | cut -d= -f2)
          CODE_SERVER_VERSION=$(grep '^CODE_SERVER_VERSION=' VERSIONS.md | cut -d= -f2)
          AWS_CLI_VERSION=$(grep '^AWS_CLI_VERSION=' VERSIONS.md | cut -d= -f2)
          GCLOUD_VERSION=$(grep '^GCLOUD_VERSION=' VERSIONS.md | cut -d= -f2)
          ALIYUN_CLI_VERSION=$(grep '^ALIYUN_CLI_VERSION=' VERSIONS.md | cut -d= -f2)
          OPENCLAW_UPSTREAM=$(grep '^OPENCLAW_UPSTREAM=' VERSIONS.md | cut -d= -f2)
          OPENCLAW_VERSION=$(grep '^OPENCLAW_VERSION=' VERSIONS.md | cut -d= -f2)

          GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-${{ github.sha }}" | cut -c1-20)
          echo "tag=$GIT_TAG" >> $GITHUB_OUTPUT
          SHORT_SHA="${{ github.sha }}"
          echo "short_sha=${SHORT_SHA:0:8}" >> $GITHUB_OUTPUT
          echo "GH_CLI_VERSION=$GH_CLI_VERSION" >> $GITHUB_OUTPUT
          echo "GITHUB_MCP_SERVER_VERSION=$GITHUB_MCP_SERVER_VERSION" >> $GITHUB_OUTPUT
          echo "TERRAFORM_VERSION=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
          echo "TERRAFORM_MCP_VERSION=$TERRAFORM_MCP_VERSION" >> $GITHUB_OUTPUT
          echo "CODE_SERVER_VERSION=$CODE_SERVER_VERSION" >> $GITHUB_OUTPUT
          echo "AWS_CLI_VERSION=$AWS_CLI_VERSION" >> $GITHUB_OUTPUT
          echo "GCLOUD_VERSION=$GCLOUD_VERSION" >> $GITHUB_OUTPUT
          echo "ALIYUN_CLI_VERSION=$ALIYUN_CLI_VERSION" >> $GITHUB_OUTPUT
          echo "OPENCLAW_UPSTREAM=$OPENCLAW_UPSTREAM" >> $GITHUB_OUTPUT
          echo "OPENCLAW_VERSION=$OPENCLAW_VERSION" >> $GITHUB_OUTPUT

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./builder
          dockerfile: ./builder/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.short_sha }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/openclaw/openclaw-base:${{ steps.version.outputs.OPENCLAW_UPSTREAM }}
            OPENCLAW_UPSTREAM=${{ steps.version.outputs.OPENCLAW_UPSTREAM }}
            OPENCLAW_VERSION=${{ steps.version.outputs.OPENCLAW_VERSION }}
            GH_CLI_VERSION=${{ steps.version.outputs.GH_CLI_VERSION }}
            GITHUB_MCP_SERVER_VERSION=${{ steps.version.outputs.GITHUB_MCP_SERVER_VERSION }}
            TERRAFORM_VERSION=${{ steps.version.outputs.TERRAFORM_VERSION }}
            TERRAFORM_MCP_VERSION=${{ steps.version.outputs.TERRAFORM_MCP_VERSION }}
            CODE_SERVER_VERSION=${{ steps.version.outputs.CODE_SERVER_VERSION }}
            AWS_CLI_VERSION=${{ steps.version.outputs.AWS_CLI_VERSION }}
            GCLOUD_VERSION=${{ steps.version.outputs.GCLOUD_VERSION }}
            ALIYUN_CLI_VERSION=${{ steps.version.outputs.ALIYUN_CLI_VERSION }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag for ArgoCD
        run: |
          echo "OPENCLAW_IMAGE_TAG=${{ steps.version.outputs.tag }}" >> $GITHUB_ENV
          echo "OPENCLAW_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}" >> $GITHUB_ENV

      - name: Logout from Azure
        if: always()
        run: |
          az logout
          rm -rf ~/.azure 2>/dev/null || true

      - name: Terraform Destroy (cleanup)
        if: always()
        run: terraform apply -destroy -auto-approve -var="env=dev" -var="unique_suffix=dev1"
        continue-on-error: true