name: Seal and Sync Secrets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/seal-secrets.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: ''

permissions:
  id-token: write
  contents: write

jobs:
  seal:
    name: Seal GH Secrets → SealedSecret YAML
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials (for kubeseal certificate fetch + kubectl apply of sealed-secrets)
        run: |
          az aks get-credentials \
            --resource-group claw-code \
            --name claw-code-aks \
            --file /tmp/kubeconfig \
            --admin

      - name: Install kubeseal
        run: |
          ARCH=$(dpkg --print-architecture)
          mkdir -p "$HOME/.local/bin"
          KUBESEAL_VERSION="0.27.3"
          curl -sLo /tmp/kubeseal.tar.gz \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-${ARCH}.tar.gz"
          tar -xzf /tmp/kubeseal.tar.gz -C "$HOME/.local/bin" kubeseal
          chmod +x "$HOME/.local/bin/kubeseal"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install kubectl
        run: |
          ARCH=$(dpkg --print-architecture)
          KUBECTL_VERSION="$(curl -sL https://dl.k8s.io/release/stable.txt)"
          curl -sLo "$HOME/.local/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch SealedSecrets certificate
        run: |
          kubeseal --fetch-cert \
            --controller-namespace kube-system \
            --controller-name sealed-secrets \
            > /tmp/ss-cert.pem
          echo ">> cert preview: $(head -1 /tmp/ss-cert.pem)"

      - name: Seal openclaw-secrets
        env:
          MISTRAL_API_KEY:         ${{ secrets.CLAW_CODE_MISTRAL_API_KEY }}
          MINIMAX_API_KEY:         ${{ secrets.CLAW_CODE_MINIMAX_API_KEY }}
          GEMINI_API_KEY:          ${{ secrets.CLAW_CODE_GEMINI_API_KEY }}
          GITHUB_TOKEN:            ${{ secrets.CLAW_CODE_GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN:      ${{ secrets.CLAW_CODE_TELEGRAM_BOT_TOKEN }}
          ENTRA_TENANT_ID:         ${{ secrets.CLAW_CODE_ENTRA_TENANT_ID }}
          ENTRA_USERNAME:          ${{ secrets.CLAW_CODE_ENTRA_USERNAME }}
          ENTRA_PASSWORD:          ${{ secrets.CLAW_CODE_ENTRA_PASSWORD }}
          ENTRA_TOTP_SEED:         ${{ secrets.CLAW_CODE_ENTRA_TOTP_SEED }}
        run: |
          echo ">> sealing openclaw-secrets..."
          kubectl create secret generic openclaw-secrets \
            --namespace openclaw \
            --dry-run=client \
            --from-literal=MISTRAL_API_KEY="$MISTRAL_API_KEY" \
            --from-literal=MINIMAX_API_KEY="$MINIMAX_API_KEY" \
            --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --from-literal=GITHUB_TOKEN="$GITHUB_TOKEN" \
            --from-literal=TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            --from-literal=ENTRA_TENANT_ID="$ENTRA_TENANT_ID" \
            --from-literal=ENTRA_USERNAME="$ENTRA_USERNAME" \
            --from-literal=ENTRA_PASSWORD="$ENTRA_PASSWORD" \
            --from-literal=ENTRA_TOTP_SEED="$ENTRA_TOTP_SEED" \
            -o yaml \
          | kubeseal --cert /tmp/ss-cert.pem --format yaml \
              > k8s/sealed-secrets.yaml
          echo ">> sealed secrets written to k8s/sealed-secrets.yaml"

      - name: Commit and push SealedSecret
        run: |
          git config user.name "kstrassheim-clawd"
          git config user.email "open.claw@futuristic.science"
          git add k8s/sealed-secrets.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: seal GH secrets into SealedSecret (manual=${{ github.event.inputs.reason != '' }})"
            git pull --rebase origin main || true
            git push
          else
            echo ">> no changes to sealed-secrets.yaml"
          fi

  sync:
    name: ArgoCD Sync (after seal)
    runs-on: ubuntu-latest
    environment: dev
    needs: seal
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group claw-code \
            --name claw-code-aks \
            --file /tmp/kubeconfig \
            --admin

      - name: Install argocd CLI
        run: |
          ARCH=$(dpkg --print-architecture)
          curl -sLO "https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-${ARCH}.tar.gz"
          tar -xzf argocd-linux-${ARCH}.tar.gz -C "$HOME/.local/bin" argocd
          chmod +x "$HOME/.local/bin/argocd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: ArgoCD login with Entra token
        run: |
          ARGOCD_SERVER="argocd.claw-code.internal"
          # Get Entra token for ArgoCD OIDC
          ENTRA_TOKEN=$(az account get-access-token \
            --resource https://$ARGOCD_SERVER \
            --query accessToken \
            -o tsv)
          argocd login "$ARGOCD_SERVER" \
            --username "${{ secrets.CLAW_CODE_ENTRA_USERNAME }}" \
            --password "$ENTRA_TOKEN" \
            --insecure \
            --yes || true

      - name: Sync openclaw ArgoCD App
        run: |
          argocd app sync openclaw --insecure --force || true