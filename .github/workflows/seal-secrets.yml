name: Apply Secrets

# Renders the claw-code-secrets Secret from the GitHub Actions environment
# secrets and applies it directly to the AKS cluster. There is no kubeseal
# step — the cluster-applied form never enters git (the manifest is piped
# straight from `kubectl create -o yaml` into `kubectl apply -f -`), so
# the encryption round-trip the previous implementation did was redundant.
# If you ever need to commit the Secret YAML to git, re-introduce kubeseal.
#
# RUN THIS AFTER THE CLUSTER IS RECREATED. The Secret lives only in the
# cluster, not in git and not in OpenTofu state, so anything that replaces the
# cluster — a region move, a destroy/apply — takes it with it. Nothing in the
# deploy notices: `Deploy to AKS` re-applies every manifest happily and then
# hangs for ten minutes on
#
#     Waiting for deployment "claw-code" rollout to finish:
#     0 of 1 updated replicas are available...
#     error: deployment "claw-code" exceeded its progress deadline
#
# because the render-config init container exits on "none of MISTRAL_API_KEY,
# MINIMAX_API_KEY or MOONSHOT_API_KEY is set" and the three CronJob pods sit in
# CreateContainerConfigError with `secret "claw-code-secrets" not found`.
#
# The `At least one LLM API key configured` gate in the deploy does NOT catch
# this: it checks the keys exist as GitHub secrets, not that they ever reached
# the cluster.
#
# Trigger it with workflow_dispatch, or — if your token lacks the Actions
# scope, which is what the `paths:` filter below is for — by pushing any change
# to this file.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/seal-secrets.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Apply claw-code-secrets to cluster
    runs-on: ubuntu-latest
    environment: dev
    env:
      KUBECONFIG: /tmp/kubeconfig

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group claw-code \
            --name claw-code-aks \
            --file /tmp/kubeconfig \
            --admin

      - name: Install kubectl
        run: |
          ARCH=$(dpkg --print-architecture)
          mkdir -p "$HOME/.local/bin"
          KUBECTL_VERSION="$(curl -sL https://dl.k8s.io/release/stable.txt)"
          curl -sLo "$HOME/.local/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply claw-code-secrets
        env:
          MISTRAL_API_KEY:         ${{ secrets.MISTRAL_API_KEY }}
          MINIMAX_API_KEY:         ${{ secrets.MINIMAX_API_KEY }}
          MOONSHOT_API_KEY:        ${{ secrets.MOONSHOT_API_KEY }}
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          # secrets.GITHUB_TOKEN is reserved by GitHub Actions (returns the
          # auto-generated workflow token, not our bot PAT). Use the
          # explicit BOT_GITHUB_TOKEN secret and apply it under the same
          # k8s-side key name (GITHUB_TOKEN) that openclaw expects.
          GITHUB_TOKEN:            ${{ secrets.BOT_GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ENTRA_TENANT_ID:         ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_USERNAME:          ${{ secrets.ENTRA_USERNAME }}
          ENTRA_PASSWORD:          ${{ secrets.ENTRA_PASSWORD }}
          ENTRA_TOTP_SEED:         ${{ secrets.ENTRA_TOTP_SEED }}
        run: |
          kubectl create secret generic claw-code-secrets \
            --namespace claw-code \
            --dry-run=client \
            --from-literal=MISTRAL_API_KEY="$MISTRAL_API_KEY" \
            --from-literal=MINIMAX_API_KEY="$MINIMAX_API_KEY" \
            --from-literal=MOONSHOT_API_KEY="$MOONSHOT_API_KEY" \
            --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --from-literal=GITHUB_TOKEN="$GITHUB_TOKEN" \
            --from-literal=TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            --from-literal=ENTRA_TENANT_ID="$ENTRA_TENANT_ID" \
            --from-literal=ENTRA_USERNAME="$ENTRA_USERNAME" \
            --from-literal=ENTRA_PASSWORD="$ENTRA_PASSWORD" \
            --from-literal=ENTRA_TOTP_SEED="$ENTRA_TOTP_SEED" \
            -o yaml \
          | kubectl apply -f -
