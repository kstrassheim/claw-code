---
# Single source of truth for the openclaw runtime config.
# Three providers are declared (kimi + minimax + mistral). Any block
# whose API key is empty/unset is stripped at pod startup by the
# `render-config` init container in 020-deployment.yaml.
#
# Model routing: Kimi K3 Max (Kimi Coding endpoint, MOONSHOT_API_KEY) is
# the primary model at high thinking; on failure openclaw fails over to
# MiniMax M3, then Mistral Large.
#
# imageModel routing: vision content goes to MiniMax M3 first (M3 is
# natively multimodal, unlike M2.7 which was text-only); on failure
# (auth error if key missing) openclaw fails over to Mistral Large 3,
# then Medium 3.5.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config-template
  namespace: claw-code
data:
  openclaw.json: |
    {
      "agents": {
        "defaults": {
          "model": {
            "primary": "mistral/mistral-large-latest",
            "fallbacks": ["kimi/k3", "minimax/MiniMax-M3"]
          },
          "imageModel": {
            "primary": "minimax/MiniMax-M3",
            "fallbacks": ["mistral/mistral-large-3-25-12", "mistral/mistral-medium-3-5-26-04"]
          },
          "compaction": {
            "mode": "safeguard"
          },
          "blockStreamingDefault": "on",
          "thinkingDefault": "high",
          "models": {
            "kimi/k3": { "params": { "thinking": "on" } },
            "minimax/MiniMax-M3": {},
            "minimax/MiniMax-M2.7": {},
            "minimax/MiniMax-M2.7-highspeed": {},
            "mistral/mistral-large-latest": {},
            "mistral/mistral-small-latest": {},
            "mistral/magistral-medium-latest": {},
            "mistral/codestral-latest": {},
            "mistral/mistral-large-3-25-12": {},
            "mistral/mistral-medium-3-5-26-04": {}
          },
          "bootstrapMaxChars": 250000,
          "bootstrapTotalMaxChars": 300000
        }
      },
      "models": {
        "providers": {
          "kimi": {
            "baseUrl": "https://api.kimi.com/coding/v1",
            "apiKey": "${MOONSHOT_API_KEY}",
            "api": "openai-completions",
            "models": [
              {
                "id": "k3",
                "name": "Kimi K3 Max",
                "reasoning": true,
                "thinkingLevelMap": {"off": null, "minimal": "low", "low": "low", "medium": "low", "high": "high", "xhigh": "max", "max": "max"},
                "input": ["text", "image"],
                "contextWindow": 1048576,
                "maxTokens": 1048576,
                "compat": {"supportsReasoningEffort": true, "supportedReasoningEfforts": ["low", "high", "max"]}
              }
            ]
          },
          "mistral": {
            "baseUrl": "https://api.mistral.ai/v1",
            "apiKey": "${MISTRAL_API_KEY}",
            "api": "openai-completions",
            "models": [
              {"id": "mistral-large-latest", "name": "Mistral Large", "contextWindow": 131072},
              {"id": "mistral-small-latest", "name": "Mistral Small", "contextWindow": 131072},
              {"id": "magistral-medium-latest", "name": "Magistral Medium", "contextWindow": 131072},
              {"id": "codestral-latest", "name": "Codestral", "contextWindow": 81920},
              {"id": "mistral-large-3-25-12", "name": "Mistral Large 3 (Vision)", "contextWindow": 131072},
              {"id": "mistral-medium-3-5-26-04", "name": "Mistral Medium 3.5 (Vision)", "contextWindow": 131072}
            ]
          },
          "minimax": {
            "baseUrl": "https://api.minimax.io/anthropic",
            "apiKey": "${MINIMAX_API_KEY}",
            "api": "anthropic-messages",
            "models": [
              {"id": "MiniMax-M3", "name": "MiniMax M3", "input": ["text", "image"], "reasoning": true, "contextWindow": 1000000, "maxTokens": 131072, "params": {"num_ctx": 1000000}},
              {"id": "MiniMax-M2.7", "name": "MiniMax M2.7", "reasoning": true, "contextWindow": 65536, "maxTokens": 8192, "params": {"num_ctx": 65536}},
              {"id": "MiniMax-M2.7-highspeed", "name": "MiniMax M2.7 HighSpeed", "reasoning": true, "contextWindow": 65536, "maxTokens": 8192, "params": {"num_ctx": 65536}}
            ]
          }
        }
      },
      "plugins": {
        "allow": ["kimi"],
        "entries": {
          "kimi": { "enabled": true }
        }
      },
      "mcp": {
        "servers": {
          "github": {
            "command": "github-mcp-server",
            "args": ["stdio"],
            "env": {
              "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
            }
          }
        }
      },
      "commands": {
        "native": "auto",
        "nativeSkills": "auto",
        "restart": true,
        "ownerDisplay": "raw"
      },
      "channels": {
        "telegram": {"enabled": true}
      },
      "gateway": {
        "port": 18789,
        "mode": "local",
        "bind": "lan",
        "trustedProxies": ["10.0.0.0/8"],
        "controlUi": {"allowedOrigins": ["*"]}
      }
    }
---
# Placeholder — populated at pod start by the render-config init container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claw-code-config
  namespace: claw-code
data:
  openclaw.json: "{}"
---
# Script the init container runs. Lives in its own ConfigMap so changes
# don't force the claw-code-config ConfigMap to be recreated.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claw-code-render-scripts
  namespace: claw-code
data:
  render-config.sh: |
    #!/bin/sh
    set -eu

    # Treat the placeholder strings (from sealed-secret stubs) the same
    # as "unset" so we don't silently activate a provider with garbage.
    is_set() {
      v="${1:-}"
      [ -n "$v" ] && [ "$v" != "REPLACE_WITH_MISTRAL_KEY" ] && [ "$v" != "REPLACE_WITH_MINIMAX_KEY" ] && [ "$v" != "REPLACE_WITH_MOONSHOT_KEY" ] && [ "$v" != "null" ]
    }

    MISTRAL_OK=
    MINIMAX_OK=
    MOONSHOT_OK=
    is_set "${MISTRAL_API_KEY:-}" && MISTRAL_OK=1 || true
    is_set "${MINIMAX_API_KEY:-}" && MINIMAX_OK=1 || true
    is_set "${MOONSHOT_API_KEY:-}" && MOONSHOT_OK=1 || true

    if [ -z "$MISTRAL_OK" ] && [ -z "$MINIMAX_OK" ] && [ -z "$MOONSHOT_OK" ]; then
      echo "ERROR: none of MISTRAL_API_KEY, MINIMAX_API_KEY or MOONSHOT_API_KEY is set. At least one must be present."
      exit 1
    fi

    # Strip providers whose API key env var is missing/empty. Use node
    # instead of jq — the openclaw base image doesn't ship jq yet, but
    # node is always there. (jq is being added to builder/Dockerfile for
    # future builds; once that ships we can fold the merge step below
    # back to jq for brevity.)
    MISTRAL_OK="${MISTRAL_OK:-}" MINIMAX_OK="${MINIMAX_OK:-}" MOONSHOT_OK="${MOONSHOT_OK:-}" node -e '
      const fs = require("fs");
      const c = JSON.parse(fs.readFileSync("/template/openclaw.json", "utf8"));
      const drop = (arr, prefix) => (arr || []).filter((m) => !m.startsWith(prefix));
      if (!process.env.MOONSHOT_OK) {
        console.log("MOONSHOT_API_KEY not set — stripping Kimi, switching primary to MiniMax");
        delete c.models?.providers?.kimi;
        if (c.agents?.defaults?.model) {
          c.agents.defaults.model.fallbacks = drop(c.agents.defaults.model.fallbacks, "kimi/");
          if ((c.agents.defaults.model.primary || "").startsWith("kimi/")) {
            c.agents.defaults.model.primary = process.env.MINIMAX_OK
              ? "minimax/MiniMax-M3"
              : "mistral/mistral-large-latest";
          }
        }
      }
      if (!process.env.MINIMAX_OK) {
        console.log("MINIMAX_API_KEY not set — stripping MiniMax");
        delete c.models?.providers?.minimax;
        if (c.agents?.defaults?.model) {
          c.agents.defaults.model.fallbacks = drop(c.agents.defaults.model.fallbacks, "minimax/");
          if ((c.agents.defaults.model.primary || "").startsWith("minimax/")) {
            c.agents.defaults.model.primary = process.env.MOONSHOT_OK
              ? "kimi/k3"
              : "mistral/mistral-large-latest";
          }
        }
        if (c.agents?.defaults?.imageModel) {
          // kimi/k3 is natively multimodal, so it can take over vision
          // duty when MiniMax is absent; otherwise fall back to Mistral.
          c.agents.defaults.imageModel.primary = process.env.MOONSHOT_OK
            ? "kimi/k3"
            : "mistral/mistral-large-3-25-12";
          c.agents.defaults.imageModel.fallbacks = drop(c.agents.defaults.imageModel.fallbacks, "minimax/");
        }
      }
      if (!process.env.MISTRAL_OK) {
        console.log("MISTRAL_API_KEY not set — stripping Mistral");
        delete c.models?.providers?.mistral;
        if (c.agents?.defaults?.model) {
          c.agents.defaults.model.fallbacks = drop(c.agents.defaults.model.fallbacks, "mistral/");
          // Mistral is the default primary, so without this the pod would boot
          // pointing at a provider that was just deleted.
          if ((c.agents.defaults.model.primary || "").startsWith("mistral/")) {
            c.agents.defaults.model.primary = process.env.MOONSHOT_OK
              ? "kimi/k3"
              : "minimax/MiniMax-M3";
          }
        }
        if (c.agents?.defaults?.imageModel) {
          c.agents.defaults.imageModel.fallbacks = drop(c.agents.defaults.imageModel.fallbacks, "mistral/");
          if ((c.agents.defaults.imageModel.primary || "").startsWith("mistral/")) {
            c.agents.defaults.imageModel.primary = process.env.MOONSHOT_OK
              ? "kimi/k3"
              : "minimax/MiniMax-M3";
          }
        }
      }
      // Never list the active primary as its own fallback (happens when a
      // stripped provider was ahead of it in the chain) — that would just
      // retry the same failing model.
      const m = c.agents?.defaults?.model;
      if (m) m.fallbacks = (m.fallbacks || []).filter((f) => f !== m.primary);
      const im = c.agents?.defaults?.imageModel;
      if (im) im.fallbacks = (im.fallbacks || []).filter((f) => f !== im.primary);
      fs.writeFileSync("/tmp/openclaw.json", JSON.stringify(c, null, 2));
    '

    # Write the rendered config to the openclaw home dir on the PVC,
    # merged with the runtime state openclaw itself writes there
    # (gateway auth token, commands.ownerAllowFrom, channels, meta, ...).
    # jq's `*` is a deep merge: our injected config provides agents/
    # models/plugins; persisted runtime fields overlay on top.
    #
    # Why direct file write instead of the openclaw-config ConfigMap +
    # envFrom in the main container: envFrom skips ConfigMap keys that
    # aren't valid env var names, and `openclaw.json` (with the dot) is
    # not valid. The main container never picked up the ConfigMap, so
    # openclaw defaulted to openai/gpt-5.5 and failed with a missing
    # OPENAI_API_KEY. Writing the merged result to /home/node/.openclaw/
    # openclaw.json (which openclaw reads on startup) fixes that.
    PERSISTENT_DIR=/home/node/.openclaw
    PERSISTENT_FILE=$PERSISTENT_DIR/openclaw.json
    mkdir -p "$PERSISTENT_DIR"

    # Deep-merge with persistent runtime state if jq is available AND
    # a persistent file exists. jq isn't in the openclaw base image yet
    # (TODO: add to builder/Dockerfile). Without it we fall back to
    # using node for the merge so the script doesn't crash.
    # Carry forward ONLY the runtime-state subset from any existing
    # persistent file. Everything else (providers, agents, models —
    # what we're declarative about) comes from the rendered template.
    # Without this allowlist, a previous broken boot could persist a
    # bad config (e.g. with a now-stripped provider) and crash all
    # future pods via the merge.
    #
    # Runtime-state keys we want to keep on restart:
    #   gateway.auth          — auto-generated bearer token
    #   commands.ownerAllowFrom  — Telegram pairing approvals
    #   channels              — per-channel enable + state
    #   meta                  — openclaw bookkeeping (lastTouchedAt, etc.)
    if [ -f "$PERSISTENT_FILE" ] && command -v node >/dev/null 2>&1; then
      echo "Carrying forward runtime state from $PERSISTENT_FILE"
      node -e '
        const fs = require("fs");
        const inj = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
        let pst = {};
        try { pst = JSON.parse(fs.readFileSync(process.argv[2], "utf8")); } catch {}
        for (const k of ["meta", "channels", "commands", "gateway"]) {
          if (pst[k] == null) continue;
          if (k === "commands") {
            inj.commands = {...(inj.commands || {})};
            if (pst.commands.ownerAllowFrom != null) inj.commands.ownerAllowFrom = pst.commands.ownerAllowFrom;
            continue;
          }
          if (k === "gateway") {
            inj.gateway = {...(inj.gateway || {})};
            if (pst.gateway.auth != null) inj.gateway.auth = pst.gateway.auth;
            continue;
          }
          inj[k] = pst[k];
        }
        fs.writeFileSync(process.argv[3], JSON.stringify(inj, null, 2));
      ' /tmp/openclaw.json "$PERSISTENT_FILE" /tmp/merged.json
      mv /tmp/merged.json /tmp/openclaw.json
    elif [ -f "$PERSISTENT_FILE" ]; then
      echo "WARN: node unavailable for runtime-state carry-over — pairings will reset"
    else
      echo "No existing openclaw.json on the PVC — writing rendered config as-is"
    fi

    # Ensure the gateway has an auth token BEFORE the config is persisted.
    #
    # gateway.auth is runtime state: the block above carries it forward from an
    # existing PVC file, and openclaw generates it on first run. Neither happens
    # on a fresh PVC — the carry-forward has nothing to read, and openclaw exits
    # before generating anything:
    #
    #     Refusing to bind gateway to lan without auth.  (exit 78)
    #
    # So the pod crashlooped on every new cluster. Generating it here closes the
    # bootstrap gap; once written it is carried forward like any other runtime
    # state, so it stays stable across restarts and redeploys.
    if command -v node >/dev/null 2>&1; then
      node -e '
        const fs = require("fs"), crypto = require("crypto");
        const f = process.argv[1];
        const c = JSON.parse(fs.readFileSync(f, "utf8"));
        c.gateway = c.gateway || {};
        if (c.gateway.auth && c.gateway.auth.token) {
          console.log("gateway.auth.token already present — keeping it");
        } else {
          c.gateway.auth = {...(c.gateway.auth || {}), mode: "token", token: crypto.randomBytes(32).toString("hex")};
          console.log("Generated a gateway.auth.token (none on the PVC yet)");
          fs.writeFileSync(f, JSON.stringify(c, null, 2));
        }
      ' /tmp/openclaw.json
    else
      echo "WARN: node unavailable — cannot ensure gateway.auth.token; gateway may refuse to bind"
    fi

    cp /tmp/openclaw.json "$PERSISTENT_FILE"
    chmod 0600 "$PERSISTENT_FILE"
    echo "Wrote $PERSISTENT_FILE ($(wc -c < "$PERSISTENT_FILE") bytes)"

    # Install the Kimi Coding plugin so kimi/k3 gets its native thinking
    # contract (off|on, incl. K3's max effort). The plugin lives in the
    # PVC-backed state dir, so this is a one-time cost per PVC; the glob
    # check keeps pod starts fast. Skipped entirely when the Kimi key is
    # absent (provider stripped above anyway).
    if [ -n "${MOONSHOT_OK:-}" ] && ! ls "$PERSISTENT_DIR/npm/projects/"*kimi-provider* >/dev/null 2>&1; then
      echo "Installing @openclaw/kimi-provider plugin..."
      openclaw plugins install @openclaw/kimi-provider \
        || echo "WARN: kimi plugin install failed — kimi/k3 falls back to core thinking levels"
    fi

    # Also keep the claw-code-config ConfigMap up to date — not consumed
    # by the main container today, but useful for debugging (`kubectl
    # get cm claw-code-config -o yaml`) and harmless.
    kubectl create configmap claw-code-config \
      -n claw-code \
      --from-file=openclaw.json=/tmp/openclaw.json \
      --dry-run=client -o yaml \
    | kubectl apply -f -
