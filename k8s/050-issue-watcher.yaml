---
# SKILL.md for the issue-watcher chat skill, mounted at
# ~/.openclaw/workspace/skills/issue-watcher/SKILL.md via subPath.
# Lets the user toggle / inspect the watcher from chat without an
# image rebuild — edit, push, redeploy applies the new ConfigMap,
# then `kubectl rollout restart deployment/claw-code` picks it up.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claw-code-skill-issue-watcher
  namespace: claw-code
data:
  SKILL.md: |
    ---
    name: issue-watcher
    description: Toggle and inspect the autonomous issue-fixer that runs as a subprocess inside this pod.
    user-invocable: true
    ---

    # issue-watcher — control the autonomous issue fixer

    A CronJob `issue-watcher` (namespace `claw-code`) ticks every 5
    minutes. On each tick it lists open GitHub issues assigned to
    this bot account, then **spawns an `openclaw agent --local`
    subprocess inside this very pod**, one per (repo, issue), against
    a long-lived git checkout under `~/.openclaw/projects/<repo>/`.

    **Concurrency is per repo, capped at 1.** The fixer holds a
    `mkdir`-based lock at `~/.openclaw/.fixer-locks/<owner>__<name>/`;
    queued issues for a busy repo wait for the next tick. Each fixer
    is bounded to ~1 hour wall-clock by the agent's `--timeout`.

    Use this skill when the user says any of:

    | User says | Run |
    |---|---|
    | `watcher status`, `is the watcher on?`, `what's the issue watcher doing?` | the status command |
    | `watcher start`, `enable the watcher`, `turn on the issue fixer` | the start command |
    | `watcher stop`, `pause the watcher`, `disable issue fixing` | the stop command |
    | `watcher list`, `what issues are being fixed?`, `active fixers` | the list command |
    | `watcher logs <repo>#<issue>` | tail the fixer log for that pair |

    ## Commands (run via your `exec` tool — kubectl is in PATH)

    ### status

    ```
    kubectl -n claw-code get cronjob issue-watcher \
      -o jsonpath='suspended={.spec.suspend}{"\n"}schedule={.spec.schedule}{"\n"}lastSchedule={.status.lastScheduleTime}{"\n"}lastSuccess={.status.lastSuccessfulTime}{"\n"}'
    ```

    Report `suspended=true` as **stopped**, `false` as **running**.

    ### start

    ```
    kubectl -n claw-code patch cronjob issue-watcher \
      -p '{"spec":{"suspend":false}}'
    ```

    Then run the status command and report the new state.

    ### stop

    Two operations: suspend the CronJob AND kill every in-flight
    fixer subprocess inside this pod immediately.

    ```
    kubectl -n claw-code patch cronjob issue-watcher \
      -p '{"spec":{"suspend":true}}'
    pkill -f 'openclaw agent --local' || true
    rm -rf $HOME/.openclaw/.fixer-locks/* 2>/dev/null
    ```

    Then run the status command. Report:
      - the new suspended state, and
      - how many fixer subprocesses were terminated (pkill returns
        non-zero when nothing matched — that's fine).

    Partial work in those subprocesses is discarded.

    ### list

    ```
    ls -1 $HOME/.openclaw/.fixer-locks/ 2>/dev/null | sed 's|__|/|'
    ```

    Each line is an `<owner>/<name>` repo with an in-flight fixer.
    Empty output = nothing is being fixed right now.

    For details, also run:

    ```
    pgrep -af 'openclaw agent --local'
    ```

    ### logs

    For `watcher logs <repo>#<issue>` (e.g. `watcher logs kstrassheim/claw-code#55`):

    ```
    tail -n 80 $HOME/.openclaw/fixer-logs/<owner>_<name>-<n>.log
    ```

    (The slash in the repo name becomes an underscore in the log
    filename. `<n>` is the issue number.)

    ### kill (alias for the second half of `stop`)

    ```
    pkill -f 'openclaw agent --local' || true
    rm -rf $HOME/.openclaw/.fixer-locks/* 2>/dev/null
    ```

    ## Reporting style

    Keep replies terse. One line per piece of state. Example status:

    > Watcher: **running** · schedule `*/5 * * * *` · last fired
    > 2026-05-18T15:25:00Z · 1 fixer active (claw-code#55).

    Do not paste raw kubectl / pgrep output unless the user asks.
---
# Issue-watcher CronJob — polls GitHub for issues assigned to the bot
# every 5 minutes and `kubectl exec`s into the main claw-code pod,
# spawning an `openclaw agent --local` subprocess there per (repo,
# issue).
#
# Architecture, top-down:
#   - This CronJob runs `cron-issue-spawn` (baked into the image).
#   - cron-issue-spawn calls `heartbeat-issue-tick` (also baked in),
#     which queries the GitHub API and lists lock dirs under
#     ~/.openclaw/.fixer-locks/ in the claw-code pod (via kubectl
#     exec). The lock list is the concurrency ledger: max 1 fixer
#     per repo, because checkouts can't be shared.
#   - For each (repo, issue) that's not locked, the spawner runs
#     `kubectl exec <claw-code-pod> -- nohup fixer-runner ...&`.
#   - `fixer-runner` (also baked in) acquires the per-repo lock,
#     git-clones-or-updates ~/.openclaw/projects/<repo>/, branches,
#     runs the embedded agent in --local mode, and releases the lock
#     on every exit path via a bash trap.
#
# Toggle from chat: see the SKILL.md above.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: issue-watcher
  namespace: claw-code
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: issue-watcher
  namespace: claw-code
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: issue-watcher
  namespace: claw-code
subjects:
  - kind: ServiceAccount
    name: issue-watcher
    namespace: claw-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: issue-watcher
---
# Permissions for the bot's chat-skill commands (CronJob get/patch
# only). Subprocess kill happens locally inside the pod via pkill,
# not via the K8s API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: issue-watcher-control
  namespace: claw-code
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["issue-watcher"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: issue-watcher-control
  namespace: claw-code
subjects:
  - kind: ServiceAccount
    name: claw-code
    namespace: claw-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: issue-watcher-control
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: issue-watcher
  namespace: claw-code
  labels:
    app: issue-watcher
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  # spec.suspend deliberately omitted — K8s defaults to false. With
  # the field unmanaged at deploy time, chat-driven `watcher stop`
  # (which patches suspend=true at runtime) sticks across `kubectl
  # apply -f k8s/` reconciles.
  jobTemplate:
    metadata:
      labels:
        app: issue-watcher
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 300
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: issue-watcher
        spec:
          serviceAccountName: issue-watcher
          restartPolicy: Never
          containers:
            - name: watcher
              image: clwcodecodevdev1.azurecr.io/openclaw/claw-code:latest
              imagePullPolicy: Always
              command: ["/usr/local/bin/cron-issue-spawn"]
              envFrom:
                # GITHUB_TOKEN is the only secret the watcher needs
                # (for the GitHub API calls). Model API keys and
                # other env are already in the main claw-code pod,
                # inherited by the spawned fixer subprocesses.
                - secretRef:
                    name: claw-code-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
