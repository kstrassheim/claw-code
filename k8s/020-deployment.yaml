---
# ServiceAccount + Role + RoleBinding so the render-config init container
# can patch the openclaw-config ConfigMap at pod start. Scoped tightly:
# only the openclaw-config ConfigMap in this namespace, get/patch/update.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw
  namespace: openclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-config-writer
  namespace: openclaw
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["openclaw-config"]
    verbs: ["get", "patch", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-config-writer
  namespace: openclaw
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: openclaw
roleRef:
  kind: Role
  name: openclaw-config-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app: openclaw
    environment: dev
    project: claw-code
spec:
  replicas: 1
  # `Recreate` (not the default RollingUpdate): terminate the old pod first,
  # then start the new one. With replicas=1 and a RWO openclaw-workspace
  # PVC, RollingUpdate deadlocks — the new pod can't mount the volume
  # while the old pod still holds it, and maxUnavailable=0 keeps the old
  # one alive until the new one is Ready. Brief downtime on each deploy
  # in exchange for a deploy that actually finishes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
      annotations:
        checksum/tools-md: "sha256:use-real-hash-after-first-sync"
    spec:
      serviceAccountName: openclaw
      initContainers:
        # Reads the canonical template from /template, decides whether
        # MiniMax is reachable based on $MINIMAX_API_KEY, strips it with
        # jq if not, and writes the rendered result back into the live
        # openclaw-config ConfigMap. The main container's envFrom picks
        # up the rendered value when it starts (envFrom resolves after
        # initContainers complete).
        - name: render-config
          image: clwcodecodevdev1.azurecr.io/openclaw/claw-code:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "/scripts/render-config.sh"]
          env:
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: MISTRAL_API_KEY
                  optional: true
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: MINIMAX_API_KEY
                  optional: true
          volumeMounts:
            - name: config-template
              mountPath: /template
            - name: render-scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: openclaw
          image: clwcodecodevdev1.azurecr.io/openclaw/claw-code:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 18789
              name: web
            - containerPort: 18790
              name: bridge
          envFrom:
            - configMapRef:
                name: openclaw-tools-md
            - configMapRef:
                name: openclaw-config
            - secretRef:
                name: openclaw-secrets
          volumeMounts:
            - name: workspace
              mountPath: /home/node/.openclaw/workspace
            - name: tools-md
              mountPath: /home/node/.openclaw/workspace/TOOLS.md
              subPath: TOOLS.md
          resources:
            # Node is Standard_D2s_v3 (2 vCPU, 8 Gi). AKS reservations
            # leave ~1.85 vCPU and ~6 Gi allocatable to user pods.
            # Pod is `Burstable` QoS: requests guarantee a baseline,
            # limits give burst headroom for spikes (build steps,
            # Chromium tabs, parallel agents). Limits stay just under
            # node-allocatable so sealed-secrets and AKS DaemonSets
            # still have breathing room.
            requests:
              cpu: 1300m
              memory: 4632Mi
            limits:
              cpu: 1700m
              memory: 5632Mi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: openclaw-workspace
        - name: tools-md
          configMap:
            name: openclaw-tools-md
        - name: config-template
          configMap:
            name: openclaw-config-template
        - name: render-scripts
          configMap:
            name: openclaw-render-scripts
            defaultMode: 0755
