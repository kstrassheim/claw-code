---
# ServiceAccount + Role + RoleBinding so the render-config init container
# can patch the claw-code-config ConfigMap at pod start. Scoped tightly:
# only the claw-code-config ConfigMap in this namespace, get/patch/update.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claw-code
  annotations:
    # Set by the deploy from the `pod_identity_client_id` OpenTofu output.
    # Without it the projected token has no identity to exchange for and every
    # Cosmos call is unauthorised.
    azure.workload.identity/client-id: "PLACEHOLDER_POD_CLIENT_ID"
  namespace: claw-code
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claw-code-config-writer
  namespace: claw-code
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["claw-code-config"]
    verbs: ["get", "patch", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claw-code-config-writer
  namespace: claw-code
subjects:
  - kind: ServiceAccount
    name: claw-code
    namespace: claw-code
roleRef:
  kind: Role
  name: claw-code-config-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claw-code
  namespace: claw-code
  labels:
    app: claw-code
    environment: dev
    project: claw-code
spec:
  replicas: 1
  # `Recreate` (not the default RollingUpdate): terminate the old pod first,
  # then start the new one. With replicas=1 and a RWO claw-code-workspace
  # PVC, RollingUpdate deadlocks — the new pod can't mount the volume
  # while the old pod still holds it, and maxUnavailable=0 keeps the old
  # one alive until the new one is Ready. Brief downtime on each deploy
  # in exchange for a deploy that actually finishes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claw-code
  template:
    metadata:
      labels:
        app: claw-code
        # Opts this pod into the workload-identity webhook, which projects the
        # ServiceAccount token the Cosmos client exchanges for an AD token.
        # The annotation on the ServiceAccount alone does nothing without it.
        azure.workload.identity/use: "true"
      annotations:
        # These two carry the CONTENT of the ConfigMaps the pod mounts, so a
        # change to the shipped scripts or to TOOLS.md changes the pod template
        # and `kubectl apply` re-rolls on its own.
        #
        # This replaced an unconditional `kubectl rollout restart` on every
        # deploy. That restart existed because the image was `:latest` — the
        # manifest never changed, so an apply alone was a no-op and the pod had
        # to be forced. Now that the image is pinned to an immutable tag, the
        # tag itself changes the template whenever the version moves, and these
        # cover the ConfigMaps, which mount as volumes and would otherwise go
        # unnoticed. A deploy that changes nothing now rolls nothing, instead of
        # spending five minutes replacing a pod with an identical one.
        #
        # Substituted by the deploy workflow; a manual apply leaves the
        # placeholders in place, which is inert (any literal value works — it
        # only has to differ when the content differs).
        checksum/scripts: PLACEHOLDER_SCRIPTS_SUM
        checksum/tools-md: PLACEHOLDER_TOOLS_SUM
        # And every OTHER ConfigMap this pod mounts — the config template, the
        # five skills, the render scripts. The first two annotations cover only
        # the ConfigMaps the workflow builds from files; these come from the
        # k8s/ manifests, and leaving them out meant a model or gateway change
        # was applied to the cluster and then never read, because no pod
        # restarted. Computed from the volume list below, so a ConfigMap added
        # to this Deployment is covered without touching the workflow.
        checksum/config: PLACEHOLDER_CONFIG_SUM
    spec:
      serviceAccountName: claw-code
      # PVC mounts default to root:root. The openclaw container runs as
      # uid 1000 (node user) and writes config + identity + tasks into
      # /home/node/.openclaw — so the mounted volume must be group-writable
      # by gid 1000.
      # - fsGroup chgrp's the mount root to gid 1000.
      # - fsGroupChangePolicy=Always makes that recursive on every mount,
      #   so existing subdirs (e.g. `workspace/` from earlier deploys with
      #   the wrong mountPath) don't stay stuck at root:root.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
      initContainers:
        # Belt-and-suspenders on top of fsGroupChangePolicy: explicitly
        # chmod the existing files so group=node has rw on dirs and rw
        # on files. fsGroup only manages group ownership; if a file was
        # created without g+w from the previous (root-owned) mount,
        # node still can't write to it after the regroup. Runs as root
        # in a busybox-style shell from the openclaw image; idempotent.
        - name: fix-perms
          # PINNED TO THE VERSION, not :latest, and substituted by the deploy.
          #
          # `:latest` with `Always` re-pulled ~1.8GB on every rollout, even when
          # the image was byte-identical — which it usually is, because the
          # build already skips when OPENCLAW_VERSION has not moved. On a
          # 2-vCPU node with a Recreate strategy that pull IS the rollout time.
          #
          # An immutable tag makes IfNotPresent correct rather than risky: the
          # node either has this exact version or it does not, so there is
          # nothing stale to serve. When the version does move, the tag moves
          # with it and the pull happens then — once.
          image: clwcodecodevdev2.azurecr.io/openclaw/claw-code:PLACEHOLDER_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              # Pre-create the subPath parent dirs that the main container's
              # ConfigMap bind-mounts (workspace/TOOLS.md, workspace/skills/
              # issue-watcher/SKILL.md) target. If we don't, kubelet creates
              # them at main-container start as root:root mode 0755. fsGroup
              # re-chgrps to gid 1000 but doesn't add g+w, so node can't write
              # files like AGENTS.md into workspace/ and Telegram dispatch
              # fails with EACCES. By pre-creating, kubelet finds the dirs
              # already in place and the chown/chmod below cover them.
              mkdir -p /home/node/.openclaw/workspace/skills/developer
              mkdir -p /home/node/.openclaw/workspace/skills/tester
              chown -R 1000:1000 /home/node/.openclaw
              chmod -R u+rwX,g+rwX /home/node/.openclaw
              # Then take the skill directories back to read-only. openclaw
              # loads ANY skill directory it finds, and these sit on a writable
              # PVC — so without this the bot could gain a capability that
              # never went through a pull request.
              #
              # Fails CLOSED: a missing binary means the image is not the one
              # we think it is, and starting anyway would leave the directories
              # writable with nothing reporting it.
              if [ ! -x /usr/local/bin/lock-skill-dirs ]; then
                echo "FATAL: lock-skill-dirs missing from the image — refusing to start" >&2
                exit 1
              fi
              /usr/local/bin/lock-skill-dirs
          volumeMounts:
            - name: claw-scripts
              mountPath: /opt/claw-scripts
            - name: workspace
              mountPath: /home/node/.openclaw
        # Reads the canonical template from /template, decides whether
        # MiniMax is reachable based on $MINIMAX_API_KEY, strips it with
        # jq if not, and writes the rendered result back into the live
        # claw-code-config ConfigMap. The main container's envFrom picks
        # up the rendered value when it starts (envFrom resolves after
        # initContainers complete).
        - name: render-config
          image: clwcodecodevdev2.azurecr.io/openclaw/claw-code:PLACEHOLDER_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/render-config.sh"]
          env:
            # THE MOUNT COMES FIRST, and that ordering is the whole mechanism:
            # the same scripts exist in the image under /usr/local/bin, so
            # whichever directory PATH names first is the one that runs. A
            # ConfigMap that fails to mount therefore degrades to the image's
            # copy — stale, but never missing.
            - name: PATH
              value: "/opt/claw-scripts:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: PYTHONPATH
              value: "/opt/claw-scripts"
            # The planning store picks its backend from the environment. This
            # deployment provides Cosmos, so no MongoDB is deployed alongside
            # it. Substituted by the deploy from the `planning_cosmos_endpoint`
            # OpenTofu output; the store falls back to spooling on disk while
            # it is unset, rather than failing a run.
            - name: PLANNING_COSMOS_ENDPOINT
              value: "PLACEHOLDER_COSMOS_ENDPOINT"
            - name: PLANNING_COSMOS_DATABASE
              value: "planning"
            - name: PLANNING_COSMOS_CONTAINER
              value: "planning"
            # The gateway's bearer token, generated by OpenTofu and held in
            # its (encrypted) state, delivered through claw-code-secrets.
            # render-config stamps it into gateway.auth.token; without it
            # openclaw exits 78 refusing to bind. NOT optional, unlike the
            # provider keys below — a missing provider degrades the bot, a
            # missing token means it does not start at all, so it should fail
            # loudly here rather than crashloop later.
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claw-code-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claw-code-secrets
                  key: MISTRAL_API_KEY
                  optional: true
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claw-code-secrets
                  key: MINIMAX_API_KEY
                  optional: true
            - name: MOONSHOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claw-code-secrets
                  key: MOONSHOT_API_KEY
                  optional: true
          volumeMounts:
            - name: config-template
              mountPath: /template
            - name: render-scripts
              mountPath: /scripts
            # Needed so render-config.sh can write the merged config into
            # /home/node/.openclaw/openclaw.json. fix-perms init runs first
            # and ensures the dir is writable by gid 1000.
            - name: workspace
              mountPath: /home/node/.openclaw
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: claw-code
          image: clwcodecodevdev2.azurecr.io/openclaw/claw-code:PLACEHOLDER_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          env:
            # THE MOUNT COMES FIRST, and that ordering is the mechanism: the
            # same scripts exist in the image under /usr/local/bin, so
            # whichever directory PATH names first is what runs. A ConfigMap
            # that fails to mount degrades to the image's copy — stale, never
            # missing. PYTHONPATH keeps the image on the path for the same
            # reason: a module the ConfigMap does not carry still resolves.
            - name: PATH
              value: "/opt/claw-scripts:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: PYTHONPATH
              value: "/opt/claw-scripts:/usr/local/bin"
          ports:
            - containerPort: 18789
              name: web
            - containerPort: 18790
              name: bridge
          envFrom:
            - configMapRef:
                name: claw-code-tools-md
            - configMapRef:
                name: claw-code-config
            - secretRef:
                name: claw-code-secrets
          volumeMounts:
            - name: claw-scripts
              mountPath: /opt/claw-scripts
            # Mount the PVC at the WHOLE openclaw state directory, not just
            # the `workspace/` subdir. Previously openclaw.json, identity/,
            # tasks/, plugin-skills/, logs/ all lived on the container's
            # ephemeral filesystem and were wiped on every pod restart —
            # which made Telegram re-pair on every restart because the
            # commands.ownerAllowFrom config (and the auth token under
            # identity/) didn't persist.
            - name: workspace
              mountPath: /home/node/.openclaw
            - name: tools-md
              mountPath: /home/node/.openclaw/workspace/TOOLS.md
              subPath: TOOLS.md
            # `developer` chat skill — drives the kubectl toggle
            # commands for the issue-fixer subsystem (the CronJob
            # itself is still named issue-watcher; only the
            # chat-facing skill name changed). ConfigMap source is
            # in 050-issue-watcher.yaml. Mount path is workspace/
            # skills/ (NOT plugin-skills/) — openclaw's
            # loadWorkspaceSkillEntries scans <workspaceDir>/skills/.
            # Pod restart required to pick up subPath updates.
            - name: skill-developer
              mountPath: /home/node/.openclaw/workspace/skills/developer/SKILL.md
              subPath: SKILL.md
            # tester chat skill — controls the autonomous deployment
            # tester. Same subPath pattern as the watcher; pod restart
            # required to pick up ConfigMap edits.
            - name: skill-tester
              mountPath: /home/node/.openclaw/workspace/skills/tester/SKILL.md
              subPath: SKILL.md
            # Defined in 052-reviewer.yaml. Without the mount the ConfigMap exists and the
            # skill is never loaded — the bot silently lacks the capability.
            - name: skill-reviewer
              mountPath: /home/node/.openclaw/workspace/skills/reviewer/SKILL.md
              subPath: SKILL.md
            # Defined in 053-projects.yaml. Without the mount the ConfigMap exists and the
            # skill is never loaded — the bot silently lacks the capability.
            - name: skill-projects
              mountPath: /home/node/.openclaw/workspace/skills/projects/SKILL.md
              subPath: SKILL.md
            # Defined in 054-planning.yaml. Without the mount the ConfigMap exists and the
            # skill is never loaded — the bot silently lacks the capability.
            - name: skill-planning
              mountPath: /home/node/.openclaw/workspace/skills/planning/SKILL.md
              subPath: SKILL.md
          resources:
            # Node is Standard_D2s_v3 (2 vCPU, 8 Gi). AKS reservations
            # leave ~1.85 vCPU and ~6 Gi allocatable to user pods.
            # Pod is `Burstable` QoS: requests guarantee a baseline,
            # limits give burst headroom for spikes (build steps,
            # Chromium tabs, parallel agents). Limits stay just under
            # node-allocatable so sealed-secrets and AKS DaemonSets
            # still have breathing room.
            # AKS system DaemonSets (Azure CNI/CNS, CSI drivers, kube-proxy,
            # coredns, konnectivity-agents, metrics-server, sealed-secrets,
            # ...) reserve ~900m CPU on a D2s_v3 node. With ~1850m
            # allocatable that leaves ~950m for openclaw. Requests must
            # stay safely below that; limits can still burst higher
            # because Kubernetes only enforces limits when the resource
            # is actually scarce. If openclaw consistently saturates the
            # limit, bump the node to D4s_v3 instead of raising requests.
            requests:
              cpu: 600m
              memory: 1500Mi
            limits:
              cpu: 1700m
              memory: 5632Mi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        # Both halves land in ONE directory, so nothing has to know which
        # ConfigMap a given script came from.
        - name: claw-scripts
          projected:
            defaultMode: 0755
            sources:
              - configMap:
                  name: claw-scripts-planner
              - configMap:
                  name: claw-scripts-runner
        - name: workspace
          persistentVolumeClaim:
            claimName: claw-code-workspace
        - name: tools-md
          configMap:
            name: claw-code-tools-md
        - name: skill-developer
          configMap:
            name: openclaw-skill-developer
        - name: skill-tester
          configMap:
            name: openclaw-skill-tester
        - name: skill-reviewer
          configMap:
            name: openclaw-skill-reviewer
        - name: skill-projects
          configMap:
            name: openclaw-skill-projects
        - name: skill-planning
          configMap:
            name: openclaw-skill-planning
        - name: config-template
          configMap:
            name: openclaw-config-template
        - name: render-scripts
          configMap:
            name: claw-code-render-scripts
            defaultMode: 0755
